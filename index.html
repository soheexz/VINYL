<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VINYL">
<meta name="theme-color" content="#0d0d10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VINYL</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   VINYL — iPad 12.9" 가로 기준
   앨범 아트가 배경을 채우고, 판이 왼쪽으로 잘려 나가는 구성
   ============================================================ */
:root{
  --ink:#fff;
  --ink-dim:rgba(255,255,255,.62);
  --glass:rgba(0,0,0,.42);
  /* 판 지름 (반응형 조절). 높이 기준 상한에서 항상 230px를 남겨서
     화면이 넓어 폰 전용 규칙이 안 걸리는 아이패드·데스크톱 사이트 모드에서도
     판이 하단 알약(재생 컨트롤·뷰 전환)과 겹치지 않게 한다 */
  --d: min(calc(100vh - 230px), calc(100vw - var(--railbase) - 40px));
  --railbase:188px;         /* 좌측 LP 선반 폭 (고정) */
  --rail:var(--railbase);   /* 접히면 0 */
  --accent:#ffffff;         /* 앨범에서 뽑은 대표색 */

  /* ---- 판 색: 블랙(기본) ---- */
  --v1:#17161b; --v2:#0f0f13; --v3:#08080b; --v4:#141319; --v5:#0a0a0d;
  --gr-hi:rgba(255,255,255,.055); --gr-lo:rgba(0,0,0,.5); --gr-fx:rgba(255,255,255,.012);
  --bd-hi:rgba(255,255,255,.085); --bd-lo:rgba(0,0,0,.55);
  --dw1:#1c1b21; --dw2:#0c0b0f;
  --v-edge:rgba(255,255,255,.10); --v-shade:rgba(0,0,0,.7);
  --sheen-op:1;
}

/* ---- 화이트 바이닐 ---- */
body.vinyl-white{
  --v1:#fdfcf9; --v2:#f1eee7; --v3:#e4e0d6; --v4:#faf7f0; --v5:#dcd7ca;
  --gr-hi:rgba(255,255,255,.7); --gr-lo:rgba(60,54,44,.16); --gr-fx:rgba(0,0,0,.03);
  --bd-hi:rgba(255,255,255,.9); --bd-lo:rgba(60,54,44,.22);
  --dw1:#f4f1ea; --dw2:#ddd8cb;
  --v-edge:rgba(0,0,0,.14); --v-shade:rgba(90,80,64,.28);
  --sheen-op:.45;
}
/* ---- 클리어(투명) 바이닐 — 뒤 배경이 비쳐 보인다 ---- */
body.vinyl-clear{
  --v1:rgba(228,240,248,.26); --v2:rgba(210,226,238,.20); --v3:rgba(196,214,228,.16);
  --v4:rgba(236,246,252,.30); --v5:rgba(186,204,218,.22);
  --gr-hi:rgba(255,255,255,.30); --gr-lo:rgba(70,90,110,.16); --gr-fx:rgba(255,255,255,.04);
  --bd-hi:rgba(255,255,255,.42); --bd-lo:rgba(60,80,100,.20);
  --dw1:rgba(226,238,246,.22); --dw2:rgba(190,208,222,.16);
  --v-edge:rgba(255,255,255,.34); --v-shade:rgba(40,60,80,.30);
  --sheen-op:.8;
}
body.vinyl-clear .disc{filter:drop-shadow(0 24px 44px rgba(0,0,0,.4));}
body.vinyl-white .disc{filter:drop-shadow(0 26px 50px rgba(0,0,0,.5));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
/* iOS 는 100% 가 브라우저 막대를 뺀 높이라 아래에 빈칸이 생긴다.
   dvh(동적 뷰포트 높이)로 실제 화면 끝까지 채운다.
   body 를 html 보다 1px 만 더 크게 둔 건 실수가 아니다 — 화면 안 모든 콘텐츠는
   #app(position:fixed)이라 문서가 스크롤돼도 화면엔 안 움직이는데, 그 1px 여유 덕분에
   "홈 화면에 추가" 없이 사파리 탭 그대로도 살짝 스크롤시켜 주소창을 접을 수 있다
   (탭 그대로 쓰면 쿠키가 유지돼 유튜브 프리미엄 로그인이 인식된다). */
html{height:100%;background:#0d0d10;-webkit-overflow-scrolling:touch;}
body{height:calc(100% + 1px);overflow:hidden;background:#0d0d10;}
@supports (height:100dvh){
  html{height:100dvh;}
  body{height:calc(100dvh + 1px);}
}
body{
  background:#0d0d10;color:var(--ink);
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  letter-spacing:-.01em;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
/* iOS 는 이미지를 길게 누르면 "사진 앱에 저장 / 복사하기" 메뉴를 띄우고
   그 이미지를 드래그 대상으로 집어간다. 그러면 우리 드래그가 가로채인다.
   이미지는 터치 대상에서 아예 빼고, 콜아웃과 끌기를 막는다. */
img{
  -webkit-touch-callout:none;
  -webkit-user-drag:none; user-drag:none;
  -webkit-user-select:none; user-select:none;
  pointer-events:none;
}
#app{
  position:fixed;left:0;right:0;top:0;height:100%;overflow:hidden;
  opacity:0;transition:opacity .34s ease;
}
#app.ready{opacity:1;}
/* 결 노이즈는 첫 페인트 뒤에 올린다 — 처음부터 깔면 지지직거리며 나타난다 */
.grain{opacity:0;transition:opacity .6s ease .15s;}
#app.ready .grain{opacity:.32;}
@supports (height:100dvh){
  #app{height:100dvh;}
}

/* ---------------- 배경: 앨범 아트 블러 ---------------- */
/* A/B 두 겹을 번갈아 쓴다.
   background-image 는 CSS 로 트랜지션되지 않는 속성이라, 한 겹으로는 곡을 바꿀 때
   배경이 툭 끊긴다. opacity 만 교차시키면 부드럽게 넘어간다. */
.bg,.bg2{
  position:absolute;inset:-12%;
  background-size:cover;background-position:center;
  filter:blur(62px) saturate(1.55);
  transform:scale(1.28);
  transition:opacity .85s cubic-bezier(.4,0,.2,1);
}
.bg{opacity:.95;}
.bg2{opacity:0;}
.tint{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(90% 70% at 20% 45%, rgba(0,0,0,.30), transparent 62%),
    linear-gradient(180deg, rgba(0,0,0,.20), transparent 26%, transparent 62%, rgba(0,0,0,.40));
}
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.32'/></svg>");
}

/* ---------------- 뷰 전환 ---------------- */
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .38s ease;}
.view.on{opacity:1;pointer-events:auto;}

/* ================= PLAYER ================= */
#playerView{display:block;}

/* ---- 좌측 세로 LP 선반 ---- */
.rail{
  position:absolute;left:0;top:0;bottom:0;width:var(--railbase);z-index:14;
  overflow:hidden;
  /* 터치 스크롤은 브라우저에 맡기지 않고 직접 계산한다.
     사파리가 이 영역의 터치를 스크롤로 넘겨주지 않는 경우가 있어서,
     touch-action 을 꺼 두고 아래 제스처 코드에서 scrollTop 을 직접 움직인다. */
  touch-action:none;
}
/* 스크롤은 브라우저에 맡기지 않는다.
   웹킷은 이 영역의 scrollHeight 를 넘친 내용만큼 늘려 주지 않아 스크롤 범위가 0 이 된다.
   그래서 안쪽 트랙을 직접 위아래로 옮긴다. */
.railtrack{
  position:relative;display:block;
  padding:44vh 22px 46vh 22px;
  will-change:transform;
}
/* 선반 패널 — 프로스티드 글래스 */
.railbg{
  position:absolute;left:0;top:0;bottom:0;width:var(--railbase);z-index:13;pointer-events:none;
  background:linear-gradient(100deg, rgba(10,9,14,.62) 0%, rgba(10,9,14,.34) 62%, rgba(10,9,14,.05) 100%);
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.08), 24px 0 60px -30px rgba(0,0,0,.8);
}
/* 위아래로 자연스럽게 사라지는 페이드 (마스크 대신 오버레이 — 3D를 깨뜨리지 않는다) */
.railfade{position:absolute;left:0;width:var(--railbase);z-index:15;pointer-events:none;}
.railfade.t{top:0;height:120px;
  background:linear-gradient(180deg, rgba(10,9,14,.92) 0%, rgba(10,9,14,.5) 46%, transparent 100%);}
.railfade.b{bottom:0;height:150px;
  background:linear-gradient(0deg, rgba(10,9,14,.94) 0%, rgba(10,9,14,.55) 44%, transparent 100%);}
/* 선반 제목 */
.railcap{
  position:absolute;left:22px;top:calc(env(safe-area-inset-top) + 24px);z-index:16;pointer-events:none;
  font:700 10.5px/1 "SF Pro Display",system-ui;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(255,255,255,.5);
}

/* 등장 애니메이션은 쓰지 않는다 — 커버플로우 transform 을 덮어써 버린다 */
.rail::-webkit-scrollbar{display:none;}

/* 레코드 바인에 세워 꽂아 둔 LP —
   자켓을 3D로 비스듬히 세워 옆면 두께와 판 모서리가 보이게 한다 */
/* 앨범을 가로로 눕혀 세로로 흐르는 3D 커버플로우.
   각 판의 transform 은 스크롤 위치에 따라 JS 가 매 프레임 계산한다. */
/* 스크롤 컨테이너 자체에는 perspective 를 주지 않는다.
   사파리는 3D 렌더링 컨텍스트가 걸린 스크롤 영역을 제대로 스크롤하지 못한다.
   대신 각 앨범의 transform 안에서 perspective() 를 직접 쓴다. */
.rail .lp{
  position:relative;display:block;cursor:pointer;
  margin-bottom:-54px;            /* 겹쳐 쌓이도록 */
  transform-style:flat;
}
.rail .sleeve{position:relative;aspect-ratio:1/1;}
.rail .sleeve::before{content:"";display:block;padding-top:100%;}
.rail .lp.on .front{box-shadow:0 0 0 2px var(--accent), 0 18px 34px rgba(0,0,0,.6);}
.rail .lp:active .sleeve{filter:brightness(1.14);}
/* 제스처: 왼쪽으로 밀어 삭제 / 길게 눌러 순서 바꾸기 */
.rail .sleeve{transition:transform .26s cubic-bezier(.2,.8,.25,1), filter .2s;}
.rail .lp.gesture .sleeve{transition:none;}
.rail .lp.willdel .front{box-shadow:0 0 0 2px #ff5b45, 0 16px 30px rgba(0,0,0,.6);}
.rail .lp.willdel .front img{opacity:.32;}
.rail .lp .delmark{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 30px/1 system-ui;color:#ff5b45;opacity:0;pointer-events:none;z-index:6;
  transition:opacity .18s;
}
.rail .lp.willdel .delmark{opacity:1;}

/* 자켓 앞면 */
.rail .front{
  position:absolute;inset:0;border-radius:2px;overflow:hidden;background:#16161b;
  box-shadow:0 14px 26px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.09);
}
.rail .front img{width:100%;height:100%;object-fit:cover;display:block;}
.rail .front::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(96deg, rgba(255,255,255,.26) 0 9%, rgba(255,255,255,.06) 17%, transparent 38%),
    linear-gradient(270deg, rgba(0,0,0,.34) 0 6%, transparent 22%);
}
/* 자켓 두께 — 3D 면 대신 앞면 위아래에 2D 로 그린다 */
.rail .top{
  position:absolute;left:0;right:0;top:0;height:15px;z-index:2;
  background:linear-gradient(180deg,#585663,#2a2933 62%,rgba(20,19,25,0));
  display:flex;align-items:center;padding:0 9px;
  border-radius:2px 2px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
}
.rail .bot{
  position:absolute;left:0;right:0;bottom:0;height:9px;z-index:2;
  background:linear-gradient(0deg,#2b2a34,rgba(14,13,18,0));
  border-radius:0 0 2px 2px;
}
/* 책등 글씨 */
.rail .top span{
  font:600 8px/1 "SF Pro Text",system-ui;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
}
/* 선반에서는 판을 보이지 않게 한다 — 앨범 자켓만 정사각형으로 */

.rail .rdel{
  position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  font-size:14px;opacity:0;transition:.2s;z-index:3;
}
.editing .rdel{opacity:1;}

/* ---- 선반 접기 ---- */
body.railoff{--rail:0px;}
/* 선반 여닫기. 열 때와 같은 감속 곡선으로 닫아서 자연스럽게 이어지게 한다. */
/* 위아래 그라데이션(.railfade)은 불투명도를 건드리지 않는다.
   슬라이드와 페이드의 속도가 어긋나면 맨 아래 앨범을 덮고 있던 어둠이 잠깐 걷혔다가
   다시 덮이면서, 그 앨범이 가까워졌다 멀어지는 것처럼 보인다.
   선반과 똑같이 옆으로 함께 미끄러지기만 하면 덮인 정도가 내내 유지된다. */
.rail,.railbg,.railfade,.railcap{
  transition:transform .46s cubic-bezier(.16,.84,.28,1);
}
body.railoff .rail,
body.railoff .railbg,
body.railoff .railfade,
body.railoff .railcap{
  transition:transform .4s cubic-bezier(.16,.84,.28,1);
}
body.railoff .rail,
body.railoff .railbg,
body.railoff .railfade,
/* .railcap 은 글자 폭만큼만 넓어서 -101% 로는 다 빠지지 않는다.
   선반 폭(+여백)만큼 밀어야 완전히 사라진다. */
body.railoff .railcap{
  transform:translateX(calc(-1 * (var(--railbase) + 60px))); /* 선반 그림자 버그 수정 */
  opacity: 0;
  pointer-events:none;
}
/* 손잡이는 선반보다 이동 거리가 짧다(선반은 그림자까지 감추려고 +60px 더 밀려난다).
   같은 시간·곡선을 쓰면 손잡이가 선반 가장자리보다 계속 뒤처져 보인다 — 더 짧게 줘서 같이 붙어 빠지게 한다 */
body.railoff .railtoggle{transition:background .2s, transform .28s cubic-bezier(.16,.84,.28,1);}

.railtoggle{
  position:absolute;left:var(--railbase);top:50%;
  transform:translate(-50%,-50%);
  width:24px;height:66px;border-radius:12px;z-index:22;
  display:flex;align-items:center;justify-content:center;
  font:600 13px/1 system-ui;color:rgba(255,255,255,.72);
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 8px 20px rgba(0,0,0,.35);
  transition:background .2s, transform .44s cubic-bezier(.22,.61,.36,1);
}
.railtoggle:active{background:rgba(255,255,255,.22);}
body.railoff .railtoggle{transform:translate(calc(-1 * var(--railbase)),-50%);}

/* ---- 판이 놓이는 무대: 선반 오른쪽 ----
   선반이 닫히면 무대를 통째로 왼쪽으로 밀어 판이 화면 가운데로 온다.
   left 를 바꾸지 않고 transform 만 쓰므로 배치를 다시 계산할 필요가 없고,
   판·후광·바닥그림자·톤암이 한 덩어리로 함께 움직여 서로 어긋나지 않는다. */
.stage{
  position:absolute;left:var(--railbase);right:0;top:0;bottom:0;
  transition:transform .46s cubic-bezier(.16,.84,.28,1);
}
body.railoff .stage{
  transform:translateX(calc(2vw - var(--railbase) * 0.52));
  transition:transform .32s cubic-bezier(.45,.02,.75,.3);
}
body.railoff .meta{
  transform:translateX(calc(2vw - var(--railbase) * 0.52));
  transition:opacity .25s, transform .32s cubic-bezier(.45,.02,.75,.3);
}
body.railoff #ytwrap{transform:translateX(calc(2vw - var(--railbase) * 0.52)) scale(.92);}

/* 판 뒤에 번지는 앨범 색 후광 */
/* border-radius + filter:blur 를 같은 요소에 함께 쓰면 사파리가 블러를
   원 밖으로 새어나가게 그려서 판 뒤에 사각형이 비쳐 보인다(.disc 그림자와 같은 종류의 버그).
   그래서 원형으로 자르는 역할(overflow:hidden)과 블러를 거는 역할을 별개 요소로 나눈다:
   바깥 .haloclip 이 원형으로 확실히 자르고, 안쪽 #halo 는 그 안에서 블러만 담당한다 */
.haloclip{
  position:absolute;top:50%;left:48%;
  /* 판 크로마와 바깥 배경(.bg) 사이 경계가 만져지지 않도록 훨씬 넓고 흐리게 퍼뜨린다 */
  width:calc(var(--d) * 2.4);height:calc(var(--d) * 2.4);
  margin:calc(var(--d) * -1.2) 0 0 calc(var(--d) * -1.2);
  border-radius:50%;overflow:hidden;
  pointer-events:none;
}
.halo{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:blur(120px) saturate(1.45);
  opacity:0;transition:opacity .7s ease, background-image .7s ease;
  pointer-events:none;
}
.halo.on{opacity:.48;}
/* 바닥에 닿은 듯한 그림자 */
/* .halo와 같은 이유 — border-radius+filter:blur 를 한 요소에 같이 쓰면 사파리가
   블러를 원 밖으로 새어나가게 그려서 판 아래에 가느다란 사각형 선이 비쳐 보인다.
   여기도 클립용 래퍼와 블러용 내부 요소로 나눈다 */
.floorclip{
  position:absolute;left:48%;top:50%;
  width:calc(var(--d) * 0.88);height:52px;
  margin:calc(var(--d) * 0.505) 0 0 calc(var(--d) * -0.44);
  border-radius:50%;overflow:hidden;
  pointer-events:none;
}
.floor{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,.22) 52%, transparent 72%);
  filter:blur(14px);opacity:0;transition:opacity .5s;pointer-events:none;
}
.floor.on{opacity:1;}

.disc{
  position:absolute;top:50%;left:48%;
  width:var(--d);height:var(--d);
  margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border-radius:50%;
  overflow:hidden;      /* 스와이프 중 사각형 모서리가 비쳐 보이지 않도록 원형으로 확실히 자른다 */
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.25,1);
  /* filter:drop-shadow 는 일부 기기에서 알파 모양 대신 사각형 바운딩박스를 기준으로
     그림자를 그려서, 판 뒤로 배경과 다른 색의 네모가 비쳐 보이는 원인이 됐다.
     box-shadow는 border-radius를 항상 그대로 따르므로 원형으로 확실하게 그려진다 */
  box-shadow:0 30px 60px rgba(0,0,0,.55);
  touch-action:none;   /* 좌우 스와이프를 브라우저에 뺏기지 않도록 미리 막는다 */
}
.disc.hide{opacity:0;transform:scale(.9);}

.spin{
  position:absolute;inset:0;border-radius:50%;
  animation:rot var(--rev,1.8s) linear infinite;
  animation-play-state:paused;
  will-change:transform;
  backface-visibility:hidden;
}
.playing .spin{animation-play-state:running;}
/* from 을 반드시 명시할 것.
   생략하면 브라우저가 요소의 현재 transform(matrix)과 rotate(360deg)를 행렬로 보간하는데,
   360도 회전 행렬은 항등행렬이라 결과적으로 전혀 돌지 않는다. */
@keyframes rot{
  from{transform:rotate(0deg);}
  to  {transform:rotate(360deg);}
}

/* 비닐 본체 — 홈, 트랙 구분선, 무광 검정 */
.vinyl{
  position:absolute;inset:0;border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      var(--gr-hi) 0 .5px,
      var(--gr-lo) .5px 1.4px,
      var(--gr-fx) 1.4px 2.2px),
    repeating-radial-gradient(circle at 50% 50%,
      transparent 0 30px,
      var(--bd-hi) 30px 31.5px,
      var(--bd-lo) 31.5px 33px,
      transparent 33px 38px),
    radial-gradient(circle at 50% 50%, var(--v1) 0%, var(--v2) 44%, var(--v3) 76%, var(--v4) 95%, var(--v5) 100%);
  box-shadow:inset 0 0 0 1px var(--v-edge);
}
/* 데드왁스 */
.deadwax{
  position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;
  background:radial-gradient(circle at 42% 36%, var(--dw1), var(--dw2) 72%);
}
/* 라벨 — 앨범 커버를 원형으로.
   Safari에서 border-radius+overflow 클리핑이 깨지는 걸 피하려고 mask로 자른다 */
.lbl{
  position:absolute;left:31.5%;top:31.5%;width:37%;height:37%;border-radius:50%;
  overflow:hidden;background:#1a1a1e;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0 99.4%, transparent 99.8%);
          mask-image:radial-gradient(circle at 50% 50%, #000 0 99.4%, transparent 99.8%);
  /* 일부 기기에서 mask-image 가 모서리를 완전히 못 지우는 경우가 있어 clip-path 로 한 번 더 자른다 */
  clip-path:circle(50%);
}
.lbl img{width:100%;height:100%;object-fit:cover;display:block;}
.lbl svg{display:block;width:100%;height:100%;}
.lbl::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
  background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.20), transparent 56%);
}
.lbl-ring{
  position:absolute;left:31.5%;top:31.5%;width:37%;height:37%;border-radius:50%;pointer-events:none;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.12);
  clip-path:circle(50%);
}
.hole{
  position:absolute;left:48.7%;top:48.7%;width:2.6%;height:2.6%;border-radius:50%;
  background:#07070a;box-shadow:0 0 0 1px rgba(255,255,255,.2);
}
/* 판 가운데를 뚫고 올라온 금속 스핀들 핀 — 판과 함께 돌지 않는다 */
.spindle{
  position:absolute;left:49.15%;top:49.15%;width:1.7%;height:1.7%;border-radius:50%;
  background:linear-gradient(148deg,#fbfbff 0%,#d2d2da 26%,#8e8e98 58%,#54545e 82%,#7a7a86 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
  z-index:5;pointer-events:none;
}
.spindle::after{
  content:"";position:absolute;left:22%;top:14%;width:34%;height:26%;border-radius:50%;
  background:rgba(255,255,255,.75);
}
/* 실물 LP 디스크 사진을 찾은 경우 판 전체 교체 */
.discphoto{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;display:none;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0 99.4%, transparent 99.8%);
          mask-image:radial-gradient(circle at 50% 50%, #000 0 99.4%, transparent 99.8%);
  clip-path:circle(50%);
}
.discphoto img{width:100%;height:100%;object-fit:cover;display:block;}
.has-disc .vinyl,.has-disc .deadwax,.has-disc .lbl,.has-disc .lbl-ring{display:none;}
.has-disc .discphoto{display:block;}

/* 고정 광택 — 판만 돌고 빛은 제자리 */
.sheen{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  opacity:var(--sheen-op);
  background:conic-gradient(from 200deg,
    rgba(255,255,255,0) 0deg, rgba(255,255,255,.14) 24deg, rgba(255,255,255,.015) 64deg,
    rgba(255,255,255,0) 100deg, rgba(255,255,255,0) 180deg,
    rgba(255,255,255,.115) 204deg, rgba(255,255,255,.012) 244deg, rgba(255,255,255,0) 288deg,
    rgba(255,255,255,0) 360deg);
  -webkit-mask:radial-gradient(circle, transparent 0 33%, #000 39% 99.4%, transparent 99.8%);
          mask:radial-gradient(circle, transparent 0 33%, #000 39% 99.4%, transparent 99.8%);
}
.rim{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 1.5px var(--v-edge), inset 0 -3px 10px var(--v-shade);
}

/* ---- 톤암: 얇고 미니멀 ---- */
.arm{
  position:absolute;width:0;height:0;transform-origin:0 0;
  transform:rotate(var(--a,90deg));
  transition:transform 1.15s cubic-bezier(.4,.05,.2,1);   /* 큐잉·복귀처럼 큰 이동 */
  z-index:16;pointer-events:none;
}
/* 재생 중 홈을 따라 안쪽으로 기어드는 움직임.
   갱신 주기(0.25초)와 비슷한 길이로 선형 보간해야 끊기지도 늘어지지도 않는다. */
.arm.quick{transition:transform .3s linear;}
.arm.dragging{transition:none;}
/* 암을 잡는 영역 — 튜브를 따라 넓게 */
.arm .hit{
  position:absolute;left:0;top:-30px;height:60px;
  pointer-events:auto;cursor:grab;
}
.arm.dragging .hit{cursor:grabbing;}
.arm.dragging .head{box-shadow:0 6px 18px rgba(0,0,0,.7), 0 0 0 3px rgba(255,255,255,.35);}
/* 드래그 중 시간 말풍선 */
.seekbub{
  position:absolute;z-index:22;transform:translate(-50%,-160%);
  padding:7px 13px;border-radius:999px;font:600 13px/1 ui-monospace,Menlo,monospace;
  background:var(--accent);color:#141414;box-shadow:0 8px 22px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap;
}
.seekbub.on{opacity:1;}
.arm .tube{
  position:absolute;left:0;top:-2.5px;height:5px;border-radius:3px;
  background:linear-gradient(180deg,#fdfdff,#c6c6cd 42%,#7c7c85 74%,#4a4a52);
  box-shadow:0 6px 14px rgba(0,0,0,.45);
}
/* 실제 톤암은 헤드셸이 암과 일직선이 아니라 안쪽으로 꺾여 있다(오프셋 앵글).
   그래야 바늘이 홈의 접선에 가깝게 놓인다. */
.arm .head{
  position:absolute;top:-8px;width:30px;height:16px;border-radius:3px 5px 5px 3px;
  background:linear-gradient(180deg,#3a3a41,#141418);
  box-shadow:0 5px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.2);
  transform-origin:0 50%;
  transform:rotate(21deg);
  transition:transform .5s cubic-bezier(.34,1.2,.4,1), box-shadow .5s;
}
.arm .head::after{
  content:"";position:absolute;right:3px;bottom:-7px;width:9px;height:9px;border-radius:1px 1px 2px 2px;
  background:linear-gradient(180deg,#4a4a52,#222227);
}
/* 큐잉 — 판 위로 들었다가 사뿐히 내려놓는다 */
.arm.lift .head{
  transform:rotate(21deg) translateY(-9px);
  box-shadow:0 14px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2);
}
.arm .pivot{
  position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #55555f, #26262c 60%, #131317);
  box-shadow:0 8px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.24);
}
.arm .pivot::after{
  content:"";position:absolute;left:32%;top:32%;width:36%;height:36%;border-radius:50%;
  background:linear-gradient(150deg,#d2d2da,#5a5a64);
}
.armpad{
  position:absolute;width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,.07);
  z-index:5;pointer-events:none;
}

/* ---- 곡 정보 (좌하단) ---- */
/* 판(.disc)은 화면 높이에 맞춰 커지는데, 노트북처럼 가로폭 대비 높이가 낮은 창에서는
   판이 왼쪽으로 많이 번져 내려와 왼쪽 아래의 제목(.meta)과 겹친다.
   판의 왼쪽 끝 지점(대략 스테이지 폭의 48% - 지름의 절반)을 넘지 않도록
   제목 폭을 그때그때 계산해서 항상 판보다 왼쪽에서 끝나게 한다 */
.meta{
  position:absolute;left:calc(var(--railbase) + 34px);bottom:calc(env(safe-area-inset-bottom) + 44px);
  max-width:min(330px, max(64px, calc(0.48 * (100vw - var(--railbase)) - (var(--d) / 2) - 58px)));
  z-index:8;
  text-shadow:0 2px 14px rgba(0,0,0,.65);
  transition:opacity .25s, transform .46s cubic-bezier(.16,.84,.28,1);
}
/* 제목 박스(.tbox)는 화면에 고정된 채 잘라내는 창 역할만 하고, 실제 글자(.t)를
   그 안에서 옆으로 움직인다. 예전엔 잘라내는 요소 자신에 transform을 줘서 —
   창이 글자와 같이 움직여 왼쪽 배경 바깥까지 새어나가 보였다. */
.meta .tbox{overflow:hidden;}
.meta .t{font:700 31px/1.13 "SF Pro Display",system-ui;letter-spacing:-.028em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;
  max-width:100%;vertical-align:top;}
/* 제목이 길어서 잘리면 전광판처럼 좌우로 훑어 보여준다 (JS 가 넘칠 때만 켠다) */
.meta .t.marquee{overflow:visible;text-overflow:clip;max-width:none;width:max-content;
  animation:titleMarquee var(--mq-dur,10s) linear infinite;}
/* 유튜브 뮤직처럼: 제목이 바뀌면 항상 처음 글자부터 바로 읽히게 제자리에서 시작해
   잠깐 멈춰 있다가, 끝까지 흘러가서 다시 잠깐 멈춘 뒤 제자리로 순간 리셋한다.
   (예전엔 화면 밖 오른쪽에서 흘러 들어오기 시작해 제목 앞부분을 놓치고 봐야 했다) */
@keyframes titleMarquee{
  0%,10%{transform:translateX(0);}
  90%,100%{transform:translateX(var(--mq-end,0px));}
}
.meta .a{font-size:11.5px;color:rgba(255,255,255,.56);margin-top:10px;letter-spacing:.17em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta .tm{font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:rgba(255,255,255,.38);margin-top:16px;letter-spacing:.08em;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.14);display:inline-block;min-width:118px;}

/* ---- 알약 컨트롤 (우측) ---- */
.pills{
  position:absolute;right:44px;bottom:calc(env(safe-area-inset-bottom) + 40px);
  display:flex;flex-direction:row;align-items:center;gap:12px;z-index:18;
}
.pill{
  width:62px;height:44px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.13);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 10px 26px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.18),
             inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .14s cubic-bezier(.2,.8,.25,1), background .2s;
}
.pill:active{transform:scale(.92);background:rgba(255,255,255,.24);}
.pill svg{width:18px;height:18px;fill:rgba(255,255,255,.92);}
.pill.main{
  width:70px;height:58px;border-radius:29px;background:rgba(255,255,255,.95);
  box-shadow:0 14px 34px rgba(0,0,0,.36), inset 0 0 0 1px rgba(255,255,255,.6);
}
.pill.main svg{width:23px;height:23px;fill:#111;}
.pill.main:active{background:#fff;}
/* 셔플 · 반복 */
.pill.sm{width:48px;height:38px;border-radius:19px;position:relative;}
.pill.sm svg{width:16px;height:16px;fill:rgba(255,255,255,.55);}
.pill.sm[aria-pressed="true"]{background:var(--accent);box-shadow:0 8px 22px rgba(0,0,0,.3);}
.pill.sm[aria-pressed="true"] svg{fill:#141414;}
.pill.sm .one{
  position:absolute;right:8px;bottom:5px;display:none;
  font:800 9px/1 system-ui;color:#141414;
}
.pill.sm[data-mode="one"] .one{display:block;}
.pill[disabled]{opacity:.3;pointer-events:none;}

/* ---- 진행 바 (화면 맨 아래 실선) ---- */
.prog{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.13);z-index:9;}
.prog i{
  display:block;height:100%;width:0%;transition:width .25s linear, background .6s;
  background:var(--accent);
  box-shadow:0 0 14px var(--accent), 0 0 4px var(--accent);
}
.proghit{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:10;cursor:pointer;}

/* ================= GRID ================= */
#gridView{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(10,9,14,.46);
  backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);
  padding:calc(env(safe-area-inset-top) + 78px) 30px 104px;
}
#gridView::-webkit-scrollbar{width:6px;}
#gridView::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px;}
/* 앨범끼리 확실히 떨어지도록 간격·모서리·그림자를 준다 */
/* 편집 중에는 앨범 위에서 브라우저가 스크롤을 가져가지 못하게 미리 막아 둔다.
   iOS 는 손가락이 닿는 순간 이 터치를 어떻게 쓸지 정하기 때문에,
   드래그가 시작된 뒤에 touch-action 을 바꾸면 이미 늦어서 pointermove 가 오지 않는다. */
.gwrap.editing .gcell,
.gwrap.editing .gcell *{touch-action:none;}

/* align-items:start 가 핵심.
   그리드 항목은 기본이 stretch 라 행 높이만큼 세로로 늘어나고, 그러면 지정한 1:1 비율이
   무시되면서 이미지가 로드될 때마다 행 높이가 다시 계산돼 크기가 출렁인다. */
.gwrap{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(var(--gcell-min,130px), 100%), 1fr));
  gap:24px;
  align-items:start;
  touch-action:pan-y;   /* 두 손가락 꼬집기를 브라우저 확대 대신 우리 코드가 처리하게 한다 */
}
.gcell{
  position:relative;aspect-ratio:1/1;height:auto;min-height:0;
  overflow:hidden;cursor:pointer;background:#111;
  contain:layout paint;
  border-radius:10px;
  box-shadow:0 14px 30px -8px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.13);
  transition:transform .26s cubic-bezier(.2,.8,.3,1), box-shadow .26s;
}
/* 터치 기기에서는 탭한 요소에 :hover 가 남아 그 칸만 떠오른 채로 굳는다.
   실제 포인터가 있는 환경에서만 hover 효과를 준다. */
@media (hover:hover) and (pointer:fine){
  .gcell:hover{transform:translateY(-5px);box-shadow:0 22px 44px -10px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.22);}
}
.gcell:active{transform:scale(.975);}
@media (hover:none){ .gcell:active{transform:none;filter:brightness(1.12);} }
/* 순서 바꾸는 중 — 주변 앨범이 실제로 자리를 비켜 준다.
   touch-action:none 으로 브라우저 스크롤을 막는다. 드래그 중에 화면이 같이 스크롤되면
   카드는 손가락 이동량만 따라가고 배경은 따로 움직여서 둘이 어긋난다. */
.gwrap.reordering{touch-action:none;}
.gwrap.reordering .gcell{transition:transform .28s cubic-bezier(.2,.8,.25,1);touch-action:none;}
.gwrap.reordering .gcell:hover,.gwrap.reordering .gcell:active{transform:none;}
.gwrap.reordering .gcell:not(.grabbed){opacity:.86;}
/* 집어 올릴 때는 짧게 부드럽게, 끌기 시작하면 손가락에 정확히 붙게 */
.gcell.grabbed{
  transition:transform .16s cubic-bezier(.2,.8,.25,1);
  z-index:500;opacity:1 !important;cursor:grabbing;
  box-shadow:0 34px 64px -14px rgba(0,0,0,.9), 0 0 0 3px var(--accent);
}
.gcell.grabbed.moving{transition:none !important;}
.gcell::before{content:"";display:block;padding-top:100%;}   /* 첫 프레임부터 정사각형 보장 */
.gcell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
/* 썸네일을 아예 못 찾아서 앱 아이콘으로 대신 채운 경우 — 사진처럼 꽉 채우지 않고 로고처럼 보이게 */
.gcell img.fallback-icon,
.rail .front img.fallback-icon{
  object-fit:contain;padding:22%;background:#0d0d10;box-sizing:border-box;
}
.gcell.on{box-shadow:0 0 0 3px var(--accent), 0 20px 40px -10px rgba(0,0,0,.8);}
/* 아이패드에는 hover 가 없다 — 제목은 항상 보이되 은은하게 */
.gcell .gt{
  position:absolute;left:0;right:0;bottom:0;padding:40px 13px 12px;
  background:linear-gradient(transparent, rgba(0,0,0,.34) 40%, rgba(0,0,0,.88));
  font-size:12px;font-weight:600;line-height:1.3;transition:.25s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 4px rgba(0,0,0,.95);opacity:.92;
}
.gcell.on .gt{opacity:1;}
@media (hover:hover) and (pointer:fine){ .gcell:hover .gt{opacity:1;} }
.gcell .geq{
  position:absolute;left:11px;top:11px;display:none;gap:3px;align-items:flex-end;height:15px;z-index:3;
}
.gcell.on .geq{display:flex;}
.gcell .geq i{width:3px;background:var(--accent);border-radius:1.5px;animation:bar .9s ease-in-out infinite;
  box-shadow:0 0 8px var(--accent);}
.gcell .geq i:nth-child(2){animation-delay:.18s}
.gcell .geq i:nth-child(3){animation-delay:.36s}
/* 편집 중 삭제 배지 — 아이폰 홈화면처럼 좌상단에 */
.gdel{
  position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;
  background:#fff;color:#111;display:flex;align-items:center;justify-content:center;
  font:700 19px/1 system-ui;
  box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.12);
  opacity:0;transform:scale(.6);transition:.22s cubic-bezier(.34,1.4,.5,1);z-index:6;
}
.editing .gdel{opacity:1;transform:none;}
.gdel:active{background:#ff5b45;color:#fff;}

/* 편집 중임을 알리는 미세한 흔들림 */
@keyframes jig{
  0%{transform:rotate(-.55deg)} 50%{transform:rotate(.55deg)} 100%{transform:rotate(-.55deg)}
}
.gwrap.editing .gcell{animation:jig .34s ease-in-out infinite;transform-origin:50% 50%;}
.gwrap.editing .gcell:nth-child(2n){animation-delay:-.11s;animation-duration:.31s;}
.gwrap.editing .gcell:nth-child(3n){animation-delay:-.21s;animation-duration:.37s;}
/* 순서를 옮기는 중에는 흔들림을 멈춘다 — transform 이 겹치면 안 된다 */
.gwrap.editing.reordering .gcell{animation:none;}

/* ================= 상단 / 하단 크롬 ================= */
.topbar{
  position:absolute;top:max(18px,calc(env(safe-area-inset-top) + 10px));left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:20;width:min(520px,72vw);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.topbar.on{opacity:1;pointer-events:auto;}
/* 링크 입력창이 열리면 같은 자리(위쪽)의 재생목록 칩·코너 버튼과 겹쳐 지저분해지므로 잠깐 숨긴다 */
body.baron .crates,
body.baron .corner{opacity:0;pointer-events:none;transition:opacity .2s;}
.topbar input{
  flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:0;outline:none;
  background:rgba(18,16,22,.92);
  color:#fff;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.topbar input::placeholder{color:rgba(255,255,255,.42);}
.topbar button{
  flex:none;width:48px;border-radius:999px;font-size:19px;font-weight:600;
  background:rgba(255,255,255,.92);color:#111;
}

.switcher{
  position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);
  display:flex;gap:2px;padding:5px;border-radius:999px;z-index:20;
  background:rgba(0,0,0,.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.14);
}
.switcher button{
  width:52px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.switcher button svg{width:17px;height:17px;fill:rgba(255,255,255,.55);}
.switcher button[aria-pressed="true"]{background:rgba(255,255,255,.92);}
.switcher button[aria-pressed="true"] svg{fill:#111;}

/* ---- 크레이트(재생목록) 전환 바 ---- */
.crates{
  position:absolute;top:max(18px,calc(env(safe-area-inset-top) + 10px));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;height:36px;padding:0 5px;border-radius:999px;z-index:19;max-width:46vw;
  background:rgba(22,20,26,.8);
  box-shadow:0 8px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.14);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.crates::-webkit-scrollbar{display:none;}
.cratechip{
  flex:none;height:32px;padding:0 15px;border-radius:999px;white-space:nowrap;
  font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.62);
  display:flex;align-items:center;gap:7px;transition:.2s;
}
.cratechip .n{font-size:10px;opacity:.6;font-weight:500;}
.cratechip[aria-pressed="true"]{background:var(--accent);color:#141414;transition:background .6s;}
.cratechip.newc{color:rgba(255,255,255,.5);font-size:15px;padding:0 13px;}
/* 앨범을 끌어와 올렸을 때 — 여기 놓으면 복사된다 */
.cratechip.dropok{
  outline:2px solid var(--accent);outline-offset:3px;
  transform:scale(1.09);background:rgba(255,255,255,.18);color:#fff;
}

.corner{
  position:absolute;top:max(18px,calc(env(safe-area-inset-top) + 10px));right:20px;display:flex;gap:8px;z-index:20;
}

/* ---- 메뉴 ---- */
.menu{
  position:absolute;top:calc(max(18px,calc(env(safe-area-inset-top) + 10px)) + 46px);right:20px;z-index:40;
  width:248px;padding:7px;border-radius:16px;
  /* 항목이 늘어나 화면보다 길어지면 아래쪽(예: 유튜브 로그인)이 잘려서 아예 안 보이던 문제 —
     최대 높이를 화면에 맞게 제한하고 넘치면 안에서 스크롤되게 한다.
     vh 기반 계산은 이 요소에서 실제로 0이 되는 경우가 확인돼(사파리 주소창 접힘 등과
     관련된 것으로 보임) 쓰지 않는다 — 여는 시점에 JS가 window.innerHeight로 직접 px를 넣는다.
     JS가 못 돌 때를 대비해 기본값은 제한 없음(그래도 잘려서 안 보이는 것보다는 낫다) */
  max-height:none;
  /* 반투명하면 뒤쪽 밝은 요소(톤암 받침 등)가 비쳐 얼룩처럼 보인다 → 불투명하게 */
  background:#1b1920;
  box-shadow:0 22px 54px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.14);
  /* 사파리에서 위쪽 요소의 backdrop-filter 가 아래 요소에 얼룩을 남기는 일이 있다.
     자체 합성 레이어로 격리하고 바깥으로 새는 그리기를 막는다. */
  isolation:isolate;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
  will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:.2s cubic-bezier(.2,.8,.25,1);
}
.menu.on{opacity:1;transform:none;pointer-events:auto;}
.menu button{
  display:flex;width:100%;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  font-size:13.5px;color:rgba(255,255,255,.9);text-align:left;transition:background .15s;
}
.menu button:active{background:rgba(255,255,255,.14);}
.menu button.warn{color:#ff8a7a;}
.menu hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:6px 9px;}
.menu .ic{width:18px;height:18px;flex:none;opacity:.78;display:flex;align-items:center;justify-content:center;}
.menu .ic svg{width:17px;height:17px;fill:currentColor;display:block;}
.chip svg{width:15px;height:15px;fill:currentColor;display:block;}
.chip{gap:6px;}
.railtoggle svg{width:13px;height:13px;fill:currentColor;display:block;}
.cratechip.newc svg{width:14px;height:14px;fill:currentColor;}
.topbar button svg{width:18px;height:18px;fill:currentColor;}
/* LP 색 — 실제 판처럼 생긴 동그라미로 고른다 */
/* LP 색 고르기.
   .menu button 이 폭 100%·안쪽 여백을 강제하므로, 선택자를 더 구체적으로 써서 눌러야 한다. */
.menu .vrow{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px 13px 12px;}
/* 판 가운데 원형 라벨(.lbl)과 이름이 겹치면 그 스타일을 물려받아
   메뉴 한가운데 어두운 타원이 생긴다. 반드시 다른 이름을 쓸 것. */
.menu .vrow .vlbl{font-size:13.5px;color:rgba(255,255,255,.9);white-space:nowrap;}
.menu .vrow .vswatches{display:flex;flex-wrap:wrap;align-items:center;gap:9px 10px;}
.menu .vrow .swatch,
.menu .vrow .swatch:active,
.menu .vrow .swatch:hover{
  /* .menu button 이 강제하는 값들을 전부 되돌린다 */
  display:block;width:30px;height:30px;min-width:30px;max-width:30px;
  padding:0;margin:0;gap:0;font-size:0;line-height:0;text-align:center;
  border-radius:50%;flex:0 0 30px;position:relative;overflow:hidden;
  background-color:transparent;
  box-shadow:0 0 0 1px rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.5);
  transition:transform .18s cubic-bezier(.34,1.4,.5,1), box-shadow .2s;
}
.menu .vrow .swatch::after{                 /* 가운데 스핀들 홀 */
  content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(255,255,255,.35);
}
.menu .vrow .swatch:active{transform:scale(.9);}
.menu .vrow .swatch[aria-pressed="true"]{
  transform:scale(1.14);
  box-shadow:0 0 0 2px var(--accent), 0 3px 10px rgba(0,0,0,.55);
}
.menu .vrow .sw-black{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.10) 0 .6px, rgba(0,0,0,.6) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #2a2931, #0b0a0e 78%);}
.menu .vrow .sw-white{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.85) 0 .6px, rgba(70,64,54,.22) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #fffefb, #dcd7ca 80%);}
.menu .vrow .sw-white::after{background:rgba(0,0,0,.5);}
.menu .vrow .sw-clear{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.45) 0 .6px, rgba(70,90,110,.18) .6px 1.7px),
  linear-gradient(140deg, rgba(228,242,252,.62), rgba(176,202,224,.32));}
.menu .vrow .sw-auto{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.34) 0 .6px, rgba(0,0,0,.22) .6px 1.7px),
  linear-gradient(140deg, var(--accent), rgba(255,255,255,.22));}
.menu .vrow .sw-red{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.30) 0 .6px, rgba(0,0,0,.30) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #ff6a5a, #b3261a 80%);}
.menu .vrow .sw-orange{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.30) 0 .6px, rgba(0,0,0,.28) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #ffa64d, #c65e00 80%);}
.menu .vrow .sw-yellow{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.34) 0 .6px, rgba(0,0,0,.22) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #ffe066, #d9a80c 80%);}
.menu .vrow .sw-dgreen{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.22) 0 .6px, rgba(0,0,0,.34) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #2f8a5c, #123c26 80%);}
.menu .vrow .sw-dblue{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.22) 0 .6px, rgba(0,0,0,.34) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #2f5aa8, #122544 80%);}
.menu .vrow .sw-dpurple{background:
  repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.22) 0 .6px, rgba(0,0,0,.34) .6px 1.7px),
  radial-gradient(circle at 36% 30%, #8b4fc4, #351c50 80%);}
.chip{
  height:36px;padding:0 15px;border-radius:999px;display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;letter-spacing:.02em;
  background:rgba(22,20,26,.82);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:rgba(255,255,255,.82);transition:.2s;
}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#111;}

/* 유튜브 플레이어 (정책상 화면에 남겨둠) */
/* iframe 은 그 영역의 터치를 전부 가로챈다.
   선반 위에 두면 선반이 스크롤되지 않으므로, 선반 오른쪽 빈 자리에 놓는다. */
#ytwrap{
  position:absolute;left:calc(var(--railbase) + 26px);top:calc(env(safe-area-inset-top) + 16px);
  width:142px;aspect-ratio:16/9;border-radius:10px;
  overflow:hidden;background:#000;opacity:.26;z-index:15;
  transition:opacity .3s, transform .3s;
  box-shadow:0 10px 26px rgba(0,0,0,.5);transform:scale(.92);transform-origin:0% 0%;
}
@media (hover:hover) and (pointer:fine){ #ytwrap:hover{opacity:1;transform:scale(1);} }
#ytwrap.big{opacity:1;transform:scale(1.7);}
/* 앨범 뷰에서는 유튜브 칸을 감춘다 */
body.gridview #ytwrap{opacity:0;pointer-events:none;transform:scale(.8);}
/* 완전히 숨기기 — iframe 은 소리의 출처라 지우면 안 되고, 보이지만 않게 한다.
   display:none 으로 만들면 재생이 멈춘다. */
/* 숨김 설정이어도 광고로 보이는 동안엔 화면을 띄운다.
   크기·위치는 광고 여부와 무관하게 항상 이 값으로 고정해 두고 opacity/pointer-events만 바꾼다 —
   광고 감지 타이머(adWatch)가 재생을 시작할 때마다 1.2초 간격으로 몇 초씩 이 클래스를 토글하는데,
   그때마다 실제 가로/세로/위치가 바뀌면(리플로우) 화면 전체가 다시 배치되며 톤암이 튀는 원인이 됐다. */
body.ythide #ytwrap{
  width:220px;height:auto;aspect-ratio:16/9;
  left:calc(var(--railbase) + 26px);top:calc(env(safe-area-inset-top) + 16px);bottom:auto;
  opacity:0;pointer-events:none;transform:none;
  box-shadow:0 12px 30px rgba(0,0,0,.6), 0 0 0 2px var(--accent);
}
body.ythide.adshow #ytwrap{opacity:1;pointer-events:auto;}
#ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

/* ---- 앱 안에서 처리하는 입력 창 (시스템 prompt/confirm 은 전체 화면을 깬다) ---- */
.modal{
  position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.modal.on{opacity:1;pointer-events:auto;}
.modal .card{
  width:min(420px,80vw);padding:24px;border-radius:20px;
  background:rgba(28,26,32,.96);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12);
  transform:translateY(10px) scale(.97);transition:transform .22s cubic-bezier(.2,.8,.25,1);
}
.modal.on .card{transform:none;}
.modal .mt{font:600 16px/1.4 "SF Pro Display",system-ui;margin-bottom:16px;letter-spacing:-.01em;}
.modal input{
  width:100%;padding:12px 14px;border-radius:11px;border:0;outline:none;margin-bottom:18px;
  background:rgba(0,0,0,.45);color:#fff;font-size:15px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}
.modal input:focus{box-shadow:inset 0 0 0 2px var(--accent);}
.modal input.hide{display:none;}
.modal .row{display:flex;gap:10px;}
.modal .row button{
  flex:1;padding:12px;border-radius:12px;font-size:14.5px;font-weight:600;
  background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.modal .row button.pri{background:var(--accent);color:#141414;box-shadow:none;}
.modal .row button:active{filter:brightness(1.2);}

.toast{
  position:absolute;left:50%;bottom:84px;transform:translate(-50%,16px);
  background:rgba(18,16,22,.94);
  padding:12px 22px;border-radius:999px;font-size:13.5px;
  box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14);
  opacity:0;pointer-events:none;transition:.28s;z-index:60;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;z-index:12;
  color:rgba(255,255,255,.66);line-height:1.75;font-size:14px;
}
.empty b{font-size:19px;color:#fff;font-weight:700;letter-spacing:-.01em;}
.empty .k{
  margin-top:6px;padding:11px 18px;border-radius:12px;font:400 12px/1.7 ui-monospace,Menlo,monospace;
  background:rgba(0,0,0,.4);color:rgba(255,255,255,.6);
}
.empty.gone{display:none;}

/* 폰 — 아이폰·갤럭시. 선반은 기본으로 접고, 열면 화면 위에 겹쳐 나온다 */
@media (max-width: 820px){
  :root {
    --d: min(70vw, calc(100vh - 260px)); /* 가로는 좁고 높이는 낮을 때 턴테이블이 잘리는 현상 방어 — 아래 알약과 안 겹치게 여유를 더 둔다 */
  }
  .stage{left:0;}
  /* 톤암도 판 크기에 맞춰 작게 — 데스크톱 고정 픽셀 크기 그대로면 작은 판에 비해 커 보인다 */
  .arm .pivot{left:-16px;top:-16px;width:32px;height:32px;}
  .arm .head{top:-5px;width:20px;height:11px;}
  .arm .head::after{right:2px;bottom:-5px;width:6px;height:6px;}
  .armpad{width:48px;height:48px;}
  /* 폰에서는 선반이 스테이지를 밀지 않고 위에 겹쳐 나오므로,
     데스크톱용 선반-닫힘 이동(translateX)은 무효화한다 — 안 그러면 이중으로 밀려난다 */
  body.railoff .stage,
  body.railoff .meta,
  body.railoff #ytwrap{transform:none;}
  :root{--railbase:172px;}
  .rail,.railbg,.railfade{width:172px;}
  .railtrack{padding:38vh 16px 40vh 16px;}
  .railcap{left:16px;}
  .railtoggle{left:172px;}
  /* 곡 제목을 판 아래(하단)가 아니라 상단 재생목록 칩 바로 밑으로 옮겨서
     판·컨트롤과 겹치지 않게 한다. 판과 재생 버튼 줄은 그만큼 아래로 내린다 */
  .meta{left:16px;right:16px;top:calc(max(10px,calc(env(safe-area-inset-top) + 10px)) + 60px);
        bottom:auto;max-width:none;}
  .meta .t{font:700 20px/1.2 "SF Pro Display",system-ui;}
  .meta .a{font-size:10.5px;margin-top:6px;}
  .meta .tm{margin-top:8px;padding-top:7px;font-size:10px;}
  .disc{top:calc(50% + 18px);}
  /* 폰에서는 컨트롤을 가운데로 모은다 — 아래 뷰 전환 알약(.switcher)과 겹치지 않을 만큼만 내린다 */
  .pills{left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 74px);justify-content:center;gap:9px;}
  .pill{width:54px;height:44px;} .pill.main{width:66px;height:56px;} .pill.sm{width:44px;height:36px;}
  .pill svg{width:18px;height:18px;} .pill.main svg{width:23px;height:23px;}
  /* 상단 재생목록 칩과 우측 코너 버튼이 겹치지 않도록,
     가운데 정렬을 풀고 좌측에 붙인 뒤 폭도 좁힌다 */
  .crates{left:16px;right:auto;transform:none;max-width:42vw;height:30px;top:max(10px,calc(env(safe-area-inset-top) + 10px));
          transition:opacity .2s;}
  /* 선반이 열리면 같은 자리(왼쪽)를 뒤덮으므로, 재생목록 칩은 선반이 닫혀 있을 때만 보여준다 */
  body:not(.railoff) .crates{opacity:0;pointer-events:none;}
  .cratechip{height:28px;padding:0 12px;font-size:11.5px;}
  .corner{right:10px;top:max(10px,calc(env(safe-area-inset-top) + 10px));gap:4px;}
  .chip{height:30px;padding:0 9px;font-size:10.5px;gap:5px;}
  #gridView{padding:calc(env(safe-area-inset-top) + 58px) 16px 96px;}
  .gcell{border-radius:8px;}
  .gcell .gt{font-size:11px;padding:28px 10px 9px;}
  /* 코너 버튼(추가·편집·⋯) 아래로 옮긴다 — 랙 오른쪽 빈자리 기준 위치를 그대로 두면 코너 버튼과 겹친다 */
  #ytwrap{left:auto;right:10px;top:calc(max(10px,calc(env(safe-area-inset-top) + 10px)) + 40px);width:104px;transform:none;transform-origin:100% 0%;}
  /* 숨김 상태에서는 광고 여부와 무관하게 크기·위치를 고정하고 opacity만 바꾼다 (리플로우로 톤암이 튀는 것 방지) */
  body.ythide #ytwrap{left:auto;right:10px;top:calc(max(10px,calc(env(safe-area-inset-top) + 10px)) + 40px);width:168px;}
  .switcher{bottom:calc(env(safe-area-inset-bottom) + 6px);}
  .modal .card{width:min(340px,86vw);padding:20px;}
}

/* 11인치·미니 등 좁은 가로 화면 — 비율은 그대로 두고 여백만 줄인다 */
@media (min-aspect-ratio: 1/1) and (max-width: 1250px){
  :root{--railbase:168px; --rail:var(--railbase);}
  .railtrack{padding-left:18px;padding-right:18px;}
  .meta{left:calc(var(--railbase) + 26px);
    max-width:min(290px, max(64px, calc(0.48 * (100vw - var(--railbase)) - (var(--d) / 2) - 50px)));}
  .meta .t{font:700 27px/1.15 "SF Pro Display",system-ui;}
  .pills{right:30px;gap:10px;}
  .pill{width:56px;height:42px;}
  .pill.main{width:64px;height:54px;}
  .pill.sm{width:44px;height:36px;}
  .crates{max-width:40vw;}
  .corner{right:14px;gap:6px;}
  .chip{padding:0 12px;font-size:11.5px;}
  #gridView{padding-left:22px;padding-right:22px;}
  #ytwrap{width:124px;}
}
@media (min-aspect-ratio: 1/1) and (max-width: 1050px){
  :root{--railbase:150px; --rail:var(--railbase);}
  .meta .t{font-size:24px;}
}

/* 폰(위 820px 블록)이 이미 자체 --d/.meta/.pills 값을 갖고 있으므로,
   여기는 그보다 넓으면서 세로로 긴 창(태블릿을 세로로 들거나 데스크톱 창을 좁힌 경우)에만 적용한다.
   안 그러면 이 블록이 파일 순서상 더 뒤에 있어 폰 전용 값을 도로 덮어써 버린다 */
@media (max-aspect-ratio: 1/1) and (min-width: 821px){
  :root{--d: min(74vw, calc(100vh - 200px));}
  .meta{left:26px;bottom:64px;max-width:60%;}
  .pills{right:22px;}
}
</style>

<script>
/* ============================================================
   상태
   ============================================================ */
const ICON={disc:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 8 8 8 8 0 0 1-8 8 8 8 0 0 1-8-8 8 8 0 0 1 8-8zm0 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z\"/></svg>", screen:"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v8h14V7H5zM8 19h8v2H8v-2z\"/></svg>"};
const STORE='vinyl_crate_v2', LIB='vinyl_lib_v3', DISC_KEY='vinyl_disc_v2';
let lib={crates:[],active:0};
let crate=[], current=-1, player=null, ready=false, playing=false, poll=null, view='player';
const $=s=>document.querySelector(s);
const el={
  bg:$('#bg'), bg2:$('#bg2'), disc:$('#disc'), spin:$('#spin'), lbl:$('#lbl'),
  photo:$('#discPhoto'), arm:$('#arm'), tube:$('#armTube'), head:$('#armHead'), pad:$('#armpad'),
  title:$('#pTitle'), titleBox:$('#pTitleBox'), artist:$('#pArtist'), time:$('#pTime'),
  fill:$('#progFill'), play:$('#bPlay'), prev:$('#bPrev'), next:$('#bNext'),
  icPlay:$('#icPlay'), icPause:$('#icPause'),
  gwrap:$('#gwrap'),
  toast:$('#toast'), empty:$('#emptyState'), player:$('#playerView'),
  stage:$('#stage'), rail:$('#rail'), track:$('#railTrack'), hit:$('#armHit'), bub:$('#seekBub'),
  halo:$('#halo'), floor:$('#floor'), metaBox:document.querySelector('.meta')
};

/* 제목이 박스보다 길면 전광판처럼 좌우로 훑어 보여준다.
   el.title.textContent 은 여러 곳에서 직접 바꾸므로, 그때마다 일일이 다시 부르는 대신
   MutationObserver 로 텍스트가 바뀔 때마다 자동으로 넘치는지 검사한다. */
function updateTitleMarquee(){
  el.title.classList.remove('marquee');
  const box=el.titleBox.clientWidth, full=el.title.scrollWidth;
  if(full-box>4){
    // 제자리(글자 맨 앞)에서 시작해 왼쪽 바깥으로 완전히 빠져나갈 때까지 흐른다.
    // 앞뒤로 잠깐 멈추는 시간은 keyframe(0~10%, 90~100%)이 담당하므로 여기선 여유를 더해준다.
    el.title.style.setProperty('--mq-end', (-full)+'px');
    const dist=full;
    el.title.style.setProperty('--mq-dur', Math.max(6,Math.min(22,dist/70+2.4)).toFixed(1)+'s');
    el.title.classList.add('marquee');
  }
}
new MutationObserver(updateTitleMarquee).observe(el.title,{childList:true,characterData:true,subtree:true});
window.addEventListener('resize',updateTitleMarquee);

/* ---- 라이브러리: 여러 개의 재생목록(크레이트) ---- */
function save(){ try{ localStorage.setItem(LIB, JSON.stringify(lib)); }catch(e){} }

function loadLib(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(LIB)); }catch(e){}
  if(raw && Array.isArray(raw.crates) && raw.crates.length){ lib=raw; }
  else{
    // v2 단일 크레이트를 옮겨온다
    let old=[];
    try{ old=JSON.parse(localStorage.getItem(STORE))||[]; }catch(e){}
    lib={crates:[{id:'c'+Date.now(), name:'MY VINYL', items:old}], active:0};
  }
  // 예전 기본 이름을 쓰고 있었다면 새 기본 이름으로
  lib.crates.forEach(c=>{ if(c.name==='내 크레이트') c.name='MY VINYL'; });
  lib.active=Math.max(0,Math.min(lib.active|0, lib.crates.length-1));
  lib.crates.forEach(c=>{
    c.items=c.items||[];
    // 예전에 저장된 4:3 썸네일(hq/sd)을 16:9 원본으로 교체
    c.items.forEach(it=>{
      if(!it.thumb || /\/(hq|sd|default|hqdefault|sddefault)/.test(it.thumb))
        it.thumb='https://i.ytimg.com/vi/'+it.id+'/maxresdefault.jpg';
    });
  });
  crate=lib.crates[lib.active].items;
}
function activeCrate(){ return lib.crates[lib.active]; }

/* ============================================================
   톤암 — 스타일러스가 실제 홈 반지름에 놓이도록 역계산
   ============================================================ */
const G={P:{x:0,y:0},C:{x:0,y:0},D:0,L:0,R:0,base:0};
let lastP=null;
const R_OUT=0.985, R_SPAN=0.42;   // 진행률 0 → 반지름 0.985R(판 가장자리), 진행률 1 → 0.565R
// 라벨 반지름은 0.37R. 헤드셸이 21도 꺾여 있어 계산한 지점보다 바늘이 시각적으로 살짝 더 안쪽에 보이므로
// 여유를 넉넉히 남겨 절대 라벨 원 안으로 들어가지 않게 한다.

function layout(){
  const st=el.stage.getBoundingClientRect();
  const w=st.width, h=st.height;
  if(!w) return;
  const r=el.disc.getBoundingClientRect();
  G.C={x:r.left-st.left+r.width/2, y:r.top-st.top+r.height/2};
  G.R=r.width/2;
  /* 폰에서는 판이 작고 위치도 다르므로, 고정된 화면비 대신 판을 기준으로 힌지 자리를 잡는다.
     안 그러면 판이 작아져도 톤암 힌지는 늘 같은 자리에 있어 판에 비해 크고 멀어 보인다 */
  const isPhone = matchMedia('(max-width:820px)').matches;
  G.P = isPhone
    ? {x:Math.min(w-20, G.C.x+G.R*1.15), y:Math.max(20, G.C.y-G.R*1.25)}
    : {x:w*0.93, y:h*0.13};
  const dx=G.C.x-G.P.x, dy=G.C.y-G.P.y;
  G.D=Math.hypot(dx,dy);
  G.L=Math.max(G.D-G.R*0.30, G.R*0.62);
  G.base=Math.atan2(dy,dx);

  el.arm.style.left=G.P.x+'px'; el.arm.style.top=G.P.y+'px';
  el.tube.style.width=(G.L-12)+'px';
  const headW=el.head.offsetWidth||30;
  el.head.style.left=(G.L-headW)+'px';
  el.hit.style.width=G.L+'px';
  const padW=el.pad.offsetWidth||74;
  el.pad.style.left=(G.P.x-padW/2)+'px'; el.pad.style.top=(G.P.y-padW/2)+'px';
  setArm(lastP);
}
function solve(rad){
  const {L,D,base}=G;
  let c=(L*L+D*D-rad*rad)/(2*L*D);
  c=Math.max(-1,Math.min(1,c));
  const a=Math.acos(c), t1=base+a, t2=base-a;
  return (G.P.y+Math.sin(t1)*L) >= (G.P.y+Math.sin(t2)*L) ? t1 : t2; // 아래쪽 해
}
/* quick=true 면 재생 중 홈을 따라가는 짧은 선형 이동,
   아니면 큐잉·복귀처럼 크게 스윙하는 느린 이동 */
function setArm(p, quick){
  lastP=p;
  if(!G.D) return;
  el.arm.classList.toggle('quick', !!quick);
  const rad = (p===null||p===undefined)
    ? Math.min(G.R*1.34, G.D+G.L-2)             // 정지: 판 바깥
    : G.R*(R_OUT - R_SPAN*Math.min(1,Math.max(0,p)));
  el.arm.style.setProperty('--a', (solve(rad)*180/Math.PI)+'deg');
}

/* 바늘을 들었다가 내려놓는 동작 */

/* ---- 톤암을 끌어서 재생 위치 조절 ---- */
let dragging=false, dragP=0;

function progressFromPoint(cx,cy){
  const st=el.stage.getBoundingClientRect();
  const px=cx-st.left, py=cy-st.top;
  const th=Math.atan2(py-G.P.y, px-G.P.x);
  const sx=G.P.x+Math.cos(th)*G.L, sy=G.P.y+Math.sin(th)*G.L;   // 스타일러스 위치
  const rad=Math.hypot(sx-G.C.x, sy-G.C.y);                      // 그 홈의 반지름
  return Math.max(0, Math.min(1, (R_OUT - rad/G.R)/R_SPAN));
}
function dragMove(e){
  if(!dragging) return;
  dragP=progressFromPoint(e.clientX,e.clientY);
  setArm(dragP, true);
  const d=(ready&&player.getDuration)?(player.getDuration()||0):0;
  el.fill.style.width=(dragP*100)+'%';
  el.time.textContent=fmt(dragP*d)+' / '+fmt(d);
  const st=el.stage.getBoundingClientRect();
  el.bub.style.left=(e.clientX-st.left)+'px';
  el.bub.style.top=(e.clientY-st.top)+'px';
  el.bub.textContent=fmt(dragP*d);
}
el.hit.addEventListener('pointerdown',e=>{
  if(current<0||!G.D) return;
  e.preventDefault(); e.stopPropagation();
  dragging=true;
  el.arm.classList.add('dragging');
  el.bub.classList.add('on');
  try{ el.hit.setPointerCapture(e.pointerId); }catch(err){}
  dragMove(e);
});
el.hit.addEventListener('pointermove',dragMove);
function dragEnd(){
  if(!dragging) return;
  dragging=false;
  el.arm.classList.remove('dragging');
  el.bub.classList.remove('on');
  if(ready&&player.getDuration){
    const d=player.getDuration()||0;
    if(d>0) player.seekTo(dragP*d,true);
  }
}
el.hit.addEventListener('pointerup',dragEnd);
el.hit.addEventListener('pointercancel',dragEnd);

/* ============================================================
   라벨: 기본은 앨범 커버 원형, 아트가 없으면 인쇄 라벨
   ============================================================ */
const PALETTES=[
  {bg:'#b31219',ink:'#f7efe0',ring:'#f0d9a8'},{bg:'#1b3f8b',ink:'#f2f0e6',ring:'#cdd8f0'},
  {bg:'#e3a01a',ink:'#2a1c05',ring:'#5e3f06'},{bg:'#101013',ink:'#e8e1d0',ring:'#c9a24a'},
  {bg:'#0d5c3a',ink:'#f0ead8',ring:'#a8d6bd'},{bg:'#e4dac2',ink:'#241d14',ring:'#8d7b56'},
  {bg:'#7a1330',ink:'#f2e6dc',ring:'#d9a9b4'},{bg:'#d8541f',ink:'#1d1208',ring:'#5c2408'}
];
function hash(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function cleanTitle(t){
  return String(t||'')
    .replace(/\([^)]*(official|video|audio|lyric|mv|m\/v|feat|ft|prod|remaster|hd|4k)[^)]*\)/ig,'')
    .replace(/\[[^\]]*(official|video|audio|lyric|mv|m\/v|remaster|hd|4k)[^\]]*\]/ig,'')
    .replace(/[|｜].*$/,'').replace(/\s{2,}/g,' ').trim();
}
function cleanArtist(a){
  return String(a||'').replace(/\s*-\s*Topic\s*$/i,'').replace(/\s*VEVO\s*$/i,'')
    .replace(/\s*Official\s*$/i,'').trim();
}
function svgEsc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ell(s,n){ return s.length>n ? s.slice(0,n-1).trim()+'…' : s; }
function wrapTitle(t,per){
  const words=t.split(/\s+/).filter(Boolean); const lines=[]; let cur='',used=0;
  for(const x of words){
    if(!cur){cur=x;used++;}
    else if((cur+' '+x).length<=per){cur+=' '+x;used++;}
    else{lines.push(cur);cur=x;used++;if(lines.length===2)break;}
  }
  if(lines.length<2&&cur) lines.push(cur);
  lines.length=Math.min(lines.length,2);
  const dropped=used<words.length;
  return lines.map((l,i)=>{
    let s=l.length>per+3?l.slice(0,per+1).trim()+'…':l;
    if(i===lines.length-1&&dropped&&!s.endsWith('…')) s+='…';
    return s;
  });
}
/* 썸네일 자체가 안 불러와질 때(삭제된 영상 등)의 기본 라벨 */
function appIconLabel(){

    '<img src="icon-512.png" draggable="false" alt="" style="width:56%;height:56%;object-fit:contain;border-radius:22%;opacity:.92">'+
    '</div>';
}
function labelSVG(item){

    font-family="Georgia,'Times New Roman',serif" font-size="${ts}" font-weight="700">${svgEsc(l.toUpperCase())}</text>`).join('');
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <path id="aT" d="M 44 200 A 156 156 0 0 1 356 200"/>
      <path id="aB" d="M 50 200 A 150 150 0 0 0 350 200"/>
      <radialGradient id="lg" cx="34%" cy="26%" r="78%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".15"/>
        <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".22"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="${p.bg}"/>
    <g transform="rotate(${tilt.toFixed(2)} 200 200)" opacity=".96">
      <circle cx="200" cy="200" r="186" fill="none" stroke="${p.ring}" stroke-width="2" opacity=".85"/>
      <circle cx="200" cy="200" r="179" fill="none" stroke="${p.ring}" stroke-width="0.8" opacity=".55"/>
      <circle cx="200" cy="200" r="118" fill="none" stroke="${p.ring}" stroke-width="0.8" opacity=".45"/>
      <text font-family="Georgia,serif" font-size="21" font-weight="700" fill="${p.ink}" letter-spacing="2.4">
        <textPath href="#aT" xlink:href="#aT" startOffset="50%" text-anchor="middle">${svgEsc(artist)}</textPath></text>
      <text font-family="Georgia,serif" font-size="14" fill="${p.ink}" letter-spacing="3.2" opacity=".82">
        <textPath href="#aB" xlink:href="#aB" startOffset="50%" text-anchor="middle">33⅓ RPM · LONG PLAYING · STEREO</textPath></text>
      ${body}
      <text x="200" y="${y0+(lines.length>1?80:66)}" text-anchor="middle" fill="${p.ink}" opacity=".8"
        font-family="Georgia,serif" font-size="15" letter-spacing="2.6">SIDE ${side}</text>
    </g>
    <circle cx="200" cy="200" r="200" fill="url(#lg)"/>

}

/* --- 실물 LP 디스크 사진: MusicBrainz → Cover Art Archive 'Medium' --- */
/* 음반 데이터베이스에서 두 가지를 함께 받아온다.
   Front = 정사각형 정식 앨범 커버 → 판 가운데 라벨에만 쓴다
   Medium = 실제 음반 원반 사진 (LP 우선, 없으면 CD 도 사용)
   유튜브 썸네일은 16:9 영상 화면이라 가운데를 잘라도 커버가 아닐 때가 많다. */
async function mbJSON(url){
  try{ const r=await fetch(url); if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
/* 후보 음반을 모은다.
   1) 곡으로 검색해 그 곡이 실린 음반들
   2) 같은 앨범의 "바이닐 발매반"을 따로 검색 — LP 원반 사진은 여기에만 붙어 있다
   바이닐 발매반을 앞에 두고 확인하면 실물 사진을 만날 확률이 크게 올라간다. */
async function releaseCandidates(title, artist){
  const vinyl=[], other=[];
  const rec=await mbJSON('https://musicbrainz.org/ws/2/recording/?fmt=json&limit=6&query='+
    encodeURIComponent('recording:"'+title.replace(/"/g,'')+'"'+(artist?' AND artist:"'+artist.replace(/"/g,'')+'"':'')));
  const albums=new Set();
  (rec&&rec.recordings||[]).forEach(r=>(r.releases||[]).forEach(rel=>{
    if(rel.id&&other.indexOf(rel.id)<0) other.push(rel.id);
    if(rel.title) albums.add(rel.title);
  }));
  await sleep(1100);                                  // MusicBrainz 요청 간격 존중
  for(const album of [...albums].slice(0,2)){
    const base='release:"'+album.replace(/"/g,'')+'"'+(artist?' AND artist:"'+artist.replace(/"/g,'')+'"':'');
    // 바이닐 발매반 우선
    let rl=await mbJSON('https://musicbrainz.org/ws/2/release/?fmt=json&limit=8&query='+
      encodeURIComponent(base+' AND format:Vinyl'));
    (rl&&rl.releases||[]).forEach(rel=>{ if(rel.id&&vinyl.indexOf(rel.id)<0) vinyl.push(rel.id); });
    await sleep(1100);
    // LP 가 없으면 CD 등 다른 발매반의 원반 사진도 받는다
    rl=await mbJSON('https://musicbrainz.org/ws/2/release/?fmt=json&limit=8&query='+encodeURIComponent(base));
    (rl&&rl.releases||[]).forEach(rel=>{ if(rel.id&&other.indexOf(rel.id)<0&&vinyl.indexOf(rel.id)<0) other.push(rel.id); });
    await sleep(1100);
  }
  return vinyl.concat(other.filter(id=>vinyl.indexOf(id)<0)).slice(0,18);
}
/* Cover Art Archive 에서 원반 사진(Medium)과 정식 커버(Front)를 고른다 */
function pickImages(imgs){
  const isDisc=x=>{
    const t=(x.types||[]).join(',').toLowerCase();
    if(t.indexOf('medium')>=0) return true;
    const c=(x.comment||'').toLowerCase();
    return /disc|vinyl|record|side a|side b|label/.test(c) && t.indexOf('front')<0 && t.indexOf('back')<0;
  };
  const big=x=>(x.thumbnails&&(x.thumbnails['1200']||x.thumbnails.large))||x.image;
  const d=imgs.find(isDisc);
  const f=imgs.find(x=>(x.types||[]).indexOf('Front')>=0) || imgs.find(x=>x.front);
  return {disc:d?big(d):null, cover:f?big(f):null};
}
async function findArt(item){
  if(!findArtOn) return {disc:null,cover:null};
  const c=discCache[item.id];
  if(c && typeof c==='object') return c;
  if(c===null) return {disc:null,cover:null};
  const title=cleanTitle(item.title), artist=cleanArtist(item.author);
  if(!title || title==='불러오는 중…') return {disc:null,cover:null};
  const out={disc:null,cover:null};
  try{
    const ids=await releaseCandidates(title,artist);
    for(const id of ids){
      const cj=await mbJSON('https://coverartarchive.org/release/'+id);
      if(cj&&cj.images){
        const p=pickImages(cj.images);
        if(!out.cover&&p.cover) out.cover=p.cover;
        if(!out.disc &&p.disc ) out.disc =p.disc;
        if(out.disc) break;               // 원반 사진을 찾으면 그만
      }
      await sleep(320);
    }
  }catch(e){}
  discCache[item.id]=out; saveDisc();
  return out;
}

/* 목록 전체를 뒤에서 천천히 훑어 미리 찾아 둔다.
   곡을 걸었을 때 이미 준비돼 있으면 바로 실물 판이 보인다. */
let prefetching=false, prefetchT=null;
async function prefetchArt(){
  if(prefetching || !findArtOn) return;
  prefetching=true;
  try{
    for(const it of crate.slice()){
      if(discCache[it.id]!==undefined) continue;
      if(!it.title || it.title==='불러오는 중…') continue;
      const a=await findArt(it);
      if(a.cover&&!it.cover){ it.cover=a.cover; save(); }
      if(a.disc &&!it.disc ){ it.disc =a.disc;  save(); }
      if((a.cover||a.disc) && crate[current] && crate[current].id===it.id){
        lblKey=null; setLabel(it);
      }
      await sleep(1400);
    }
  }catch(e){}
  prefetching=false;
}

let lblKey=null;
function setLabel(item){
  const key=item?item.id+'|'+(item.title||''):'';
  if(key===lblKey) return;
  lblKey=key;
  el.disc.classList.remove('has-disc'); el.photo.innerHTML='';
  if(!item){ el.lbl.innerHTML=''; return; }

  const src=(findArtOn && item.cover) || item.thumb;   // 정식 앨범 커버가 있으면 그걸 쓴다
  if(src){
    const img=new Image();
    img.draggable=false;
    // 유튜브 썸네일을 못 불러오면(삭제된 영상 등) 생성 아트 대신 앱 아이콘을 보여준다 —
    // 링크는 붙였는데 이미지가 안 나오는 상황이라는 걸 바로 알아보게.
    // 에러도 안 나고 그냥 멈춰버리는 경우(느린 서버·CORS 등)까지 대비해 시간제한도 둔다.
    let settled=false;
    const fallback=()=>{
      if(settled||lblKey!==key) return;
      settled=true;
      el.lbl.innerHTML=appIconLabel();
    };
    img.onload=()=>{ settled=true; };
    img.onerror=fallback;
    img.src=src;
    el.lbl.innerHTML=''; el.lbl.appendChild(img);
    setTimeout(fallback,4500);
  } else {
    el.lbl.innerHTML=labelSVG(item);
  }

  if(findArtOn && item.disc){ applyDisc(item,item.disc,false); }
  if(!findArtOn) return;
  if(item.cover && item.disc!==undefined) return;

  findArt(item).then(a=>{
    let changed=false;
    if(a.cover && !item.cover){ item.cover=a.cover; changed=true; }
    if(a.disc  && !item.disc ){ item.disc =a.disc;  changed=true; }
    if(!changed) return;
    save(); renderAll();
    if(crate[current]&&crate[current].id===item.id){
      if(a.cover){ lblKey=null; setLabel(item); }
      if(a.disc) applyDisc(item,a.disc,true);
    }
  });
}
/* 음반 사진은 대개 흰 배경 위에 원반이 놓인 사각형 이미지다.
   그대로 원형으로 자르면 배경이 남거나 원반이 잘린다.
   배경과 다른 픽셀의 경계를 찾아 원반만 정사각형으로 오려낸 뒤 쓰면 원에 딱 맞는다. */
const fitCache={};
function fitDiscImage(url){
  return new Promise(res=>{
    if(url in fitCache) return res(fitCache[url]);
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const NW=200, NH=Math.max(40,Math.round(NW*img.naturalHeight/img.naturalWidth));
        const cv=document.createElement('canvas'); cv.width=NW; cv.height=NH;
        const ctx=cv.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,NW,NH);
        const D=ctx.getImageData(0,0,NW,NH).data;
        const at=(x,y)=>{const i=(y*NW+x)*4; return [D[i],D[i+1],D[i+2],D[i+3]];};
        const cor=[at(1,1),at(NW-2,1),at(1,NH-2),at(NW-2,NH-2)];
        const bg=[0,1,2].map(k=>cor.reduce((s,c)=>s+c[k],0)/4);
        const bgA=cor.reduce((s,c)=>s+c[3],0)/4;
        let x0=NW,y0=NH,x1=-1,y1=-1;
        for(let y=0;y<NH;y++) for(let x=0;x<NW;x++){
          const c=at(x,y);
          const on = bgA<24 ? c[3]>40
                   : (Math.abs(c[0]-bg[0])+Math.abs(c[1]-bg[1])+Math.abs(c[2]-bg[2]))>58;
          if(on){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
        }
        const w=x1-x0, hgt=y1-y0;
        if(x1<0 || w<NW*0.25 || hgt<NH*0.25){ fitCache[url]=null; return res(null); }
        const cx=(x0+x1)/2, cy=(y0+y1)/2, r=Math.max(w,hgt)/2*1.015;
        const sc=img.naturalWidth/NW;
        const S=Math.max(240, Math.min(1100, Math.round(r*2*sc)));
        const out=document.createElement('canvas'); out.width=out.height=S;
        const o=out.getContext('2d');
        o.imageSmoothingQuality='high';
        o.drawImage(img,(cx-r)*sc,(cy-r)*sc,r*2*sc,r*2*sc,0,0,S,S);
        const data=out.toDataURL('image/jpeg',0.92);
        fitCache[url]=data; res(data);
      }catch(e){ fitCache[url]=null; res(null); }   // CORS 로 캔버스가 오염되면 포기
    };
    img.onerror=()=>{ fitCache[url]=null; res(null); };
    img.src=url;
  });
}

function applyDisc(item,url,announce){

/* ---- 앨범에서 대표색을 뽑아 UI 강조색으로 ---- */
const colorCache={};
function dominantColor(url){
  return new Promise(res=>{
    if(url in colorCache) return res(colorCache[url]);
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const n=44, cv=document.createElement('canvas');
        cv.width=n; cv.height=n;
        const ctx=cv.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,n,n);
        const d=ctx.getImageData(0,0,n,n).data;
        const buckets={};
        for(let p=0;p<d.length;p+=4){
          const r=d[p],g=d[p+1],b=d[p+2];
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const v=mx/255, s=mx?(mx-mn)/mx:0;
          if(v<0.16||v>0.98) continue;      // 새까맣거나 새하얀 픽셀 제외
          if(s<0.20) continue;              // 무채색 제외
          const key=(r>>4)+','+(g>>4)+','+(b>>4);
          const w=s*v;
          const bk=buckets[key]||(buckets[key]={w:0,r:0,g:0,b:0});
          bk.w+=w; bk.r+=r*w; bk.g+=g*w; bk.b+=b*w;
        }
        let best=null;
        for(const k in buckets) if(!best||buckets[k].w>best.w) best=buckets[k];
        if(!best){ colorCache[url]=null; return res(null); }
        let r=best.r/best.w, g=best.g/best.w, b=best.b/best.w;
        // 어두운 색은 끌어올려야 어두운 배경 위에서 보인다
        const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
        if(lum<0.46){ const k=0.46/Math.max(lum,0.06); r=Math.min(255,r*k); g=Math.min(255,g*k); b=Math.min(255,b*k); }
        const hex='#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
        colorCache[url]=hex; res(hex);
      }catch(e){ colorCache[url]=null; res(null); }   // CORS 로 캔버스가 오염되면 포기
    };
    img.onerror=()=>{ colorCache[url]=null; res(null); };
    img.src=url;
  });
}
function applyAccent(hex){
  const c=hex||'#ffffff';
  document.documentElement.style.setProperty('--accent', c);
  if(vinylColor==='auto') tintVinyl(c);
}
/* 요즘 LP 는 컬러반·마블반이 흔하다.
   앨범 대표색으로 반투명 컬러 바이닐을 만들어 실물 프레싱처럼 보이게 한다. */
function tintVinyl(hex){
  const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex||'');
  const s=document.documentElement.style;
  if(!m){ ['--v1','--v2','--v3','--v4','--v5','--dw1','--dw2'].forEach(k=>s.removeProperty(k)); return; }
  const r=parseInt(m[1],16), g=parseInt(m[2],16), b=parseInt(m[3],16);
  const mix=(f,a)=>'rgba('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+','+a+')';
  s.setProperty('--v1', mix(1.00,.62));
  s.setProperty('--v2', mix(0.80,.70));
  s.setProperty('--v3', mix(0.58,.76));
  s.setProperty('--v4', mix(1.10,.58));
  s.setProperty('--v5', mix(0.52,.72));
  s.setProperty('--dw1', mix(0.86,.66));
  s.setProperty('--dw2', mix(0.58,.74));
  s.setProperty('--gr-hi','rgba(255,255,255,.28)');
  s.setProperty('--gr-lo','rgba(0,0,0,.30)');
  s.setProperty('--bd-hi','rgba(255,255,255,.40)');
  s.setProperty('--bd-lo','rgba(0,0,0,.34)');
  s.setProperty('--v-edge','rgba(255,255,255,.30)');
  s.setProperty('--v-shade','rgba(0,0,0,.40)');
  s.setProperty('--sheen-op','.85');
}

let bgFlip=false, bgKey=null;
function setBG(item){
  const u = (item && item.thumb) || null;
  if(u===bgKey) return;                 // 같은 그림이면 다시 교차시키지 않는다
  bgKey=u;
  const css = u?`url("${u}")`:'none';
  // 뒤에 있는 겹에 새 이미지를 넣고 불투명도만 교차시킨다
  const incoming = bgFlip ? el.bg : el.bg2;
  const outgoing = bgFlip ? el.bg2 : el.bg;
  incoming.style.backgroundImage=css;
  incoming.style.opacity='.95';
  outgoing.style.opacity='0';
  bgFlip=!bgFlip;
  // background-image 는 트랜지션이 안 먹어서 halo만 툭 바뀌면 .bg 크로스페이드와 어긋나
  // 잘린 듯한 경계가 보인다 — 잠깐 꺼졌다가 새 이미지로 다시 켜서 함께 자연스럽게 넘어가게 한다
  el.halo.style.transition='opacity .3s ease';
  el.halo.style.opacity='0';
  setTimeout(()=>{
    el.halo.style.backgroundImage=css;
    el.halo.style.transition='';
    el.halo.style.opacity='';
    el.halo.classList.toggle('on', !!u);
  },300);
  el.floor.classList.toggle('on', !!u);
  if(u) dominantColor(u).then(applyAccent); else applyAccent(null);
}

function setPlaying(v){
  playing=v;

function startPoll(){
  if(poll) return;
  poll=setInterval(()=>{
    if(!ready||!player.getDuration||dragging) return;   // 드래그 중엔 손대지 않는다
    /* 트랙을 빠르게 연달아 넘기면, loadVideoById 가 아직 안 끝나 플레이어가
       직전 곡의 currentTime/duration 을 잠깐 그대로 들고 있는 순간이 있다.
       그 사이에 읽은 값으로 톤암을 갱신하면 새 곡인데 이전 곡 위치로 튀어 보인다 —
       playIndex 에서 이미 setArm(0) 으로 맞춰 둔 값을 실제 영상이 안 바뀌었는데도
       덮어써 버리는 것. video_id 가 지금 재생 중이어야 할 곡과 다르면 이번 틱은 건너뛴다. */
    const vd=player.getVideoData&&player.getVideoData(), it=crate[current];
    if(it&&vd&&vd.video_id&&vd.video_id!==it.id) return;
    const d=player.getDuration()||0, t=player.getCurrentTime()||0;
    if(d>0){
      const p=t/d;
      el.fill.style.width=(p*100)+'%';
      el.time.textContent=fmt(t)+' / '+fmt(d);
      if(playing) setArm(p, true);
      const nw=Date.now();
      if(playing && nw-psT>5000){ psT=nw; savePlayState(); }   // 5초마다 위치 저장
    }
  },250);
}
function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function syncMeta(){

function playIndex(i){

  current=i;

  updateMediaSession(); savePlayState();
  setView('player');
  renderAll(); updateButtons();
  setTimeout(()=>railScrollTo(i),120);
}

let shuffle=false, repeatMode='off';   // off | all | one
try{
  shuffle=localStorage.getItem('vinyl_shuffle')==='1';
  repeatMode=localStorage.getItem('vinyl_repeat')||'off';
}catch(e){}
let shuffleBag=[];                     // 셔플은 한 바퀴 안에서 같은 곡을 두 번 틀지 않는다

function refillBag(){
  shuffleBag=crate.map((_,i)=>i).filter(i=>i!==current);
  for(let i=shuffleBag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffleBag[i],shuffleBag[j]]=[shuffleBag[j],shuffleBag[i]];
  }
}
function nextIndex(){
  if(!crate.length) return -1;
  if(crate.length===1) return 0;
  if(shuffle){
    shuffleBag=shuffleBag.filter(i=>i<crate.length&&i!==current);
    if(!shuffleBag.length) refillBag();
    return shuffleBag.shift();
  }
  return (current+1)%crate.length;
}
function next(){ const i=nextIndex(); if(i>=0) playIndex(i); }

function syncModes(){
  const s=$('#bShuffle'), r=$('#bRepeat');
  s.setAttribute('aria-pressed',shuffle);
  r.setAttribute('aria-pressed', repeatMode!=='off');
  r.dataset.mode=repeatMode;
  r.setAttribute('aria-label', repeatMode==='one'?'한 곡 반복':repeatMode==='all'?'전체 반복':'반복 끄기');
}
$('#bShuffle').addEventListener('click',()=>{
  shuffle=!shuffle; shuffleBag=[];
  try{ localStorage.setItem('vinyl_shuffle',shuffle?'1':'0'); }catch(e){}
  syncModes();
  toast(shuffle?'셔플 켜짐':'셔플 꺼짐');
});
$('#bRepeat').addEventListener('click',()=>{
  repeatMode = repeatMode==='off' ? 'all' : repeatMode==='all' ? 'one' : 'off';
  try{ localStorage.setItem('vinyl_repeat',repeatMode); }catch(e){}
  syncModes();
  toast(repeatMode==='all'?'전체 반복':repeatMode==='one'?'한 곡 반복':'반복 꺼짐');
});
function prev(){
  if(!crate.length) return;
  if(ready&&player.getCurrentTime&&player.getCurrentTime()>3){ player.seekTo(0); setArm(0); cueDown(); return; }
  playIndex((current-1+crate.length)%crate.length);
}
function onEnded(){
  if(!crate.length){ setPlaying(false); setArm(null); return; }
  if(repeatMode==='one'){                       // 한 곡 반복
    setArm(0); cueDown();
    try{ player.seekTo(0,true); player.playVideo(); }catch(e){}
    return;
  }
  const atEnd = !shuffle && current===crate.length-1;
  if(repeatMode==='off' && (atEnd || crate.length===1)){   // 목록 끝에서 정지
    setPlaying(false); setArm(null);
    return;
  }
  next();
}
function updateButtons(){
  const has=crate.length>0;
  el.play.disabled=!has; el.prev.disabled=!has; el.next.disabled=crate.length<2;
  // 곡이 하나라도 있으면 안내문은 숨긴다 (재생 중인지와 무관)
  el.empty.classList.toggle('gone', has);
}

function parseInput(raw){
  const out={videos:[],list:null};
  raw.split(/[\s,]+/).filter(Boolean).forEach(tok=>{
    let s=tok.trim();
    if(/^[\w-]{11}$/.test(s)){ out.videos.push(s); return; }
    if(/^(PL|OLAK5uy_|RD|UU|LL|FL)[\w-]{10,}$/.test(s)){ out.list=s; return; }
    let u; try{ u=new URL(s.startsWith('http')?s:'https://'+s); }catch(e){ return; }
    const list=u.searchParams.get('list'), v=u.searchParams.get('v');
    if(v&&/^[\w-]{11}$/.test(v)) out.videos.push(v);
    else if(u.hostname.includes('youtu.be')){
      const id=u.pathname.slice(1).split('/')[0];
      if(/^[\w-]{11}$/.test(id)) out.videos.push(id);
    } else if(u.pathname.includes('/shorts/')||u.pathname.includes('/embed/')){
      const id=u.pathname.split('/').filter(Boolean).pop();
      if(/^[\w-]{11}$/.test(id)) out.videos.push(id);
    }
    if(list&&!out.list) out.list=list;
  });
  return out;
}
/* 반드시 16:9 원본만 쓴다.
   hqdefault(480x360) / sddefault(640x480) 는 4:3 이라 위아래에 검은 띠가 박혀 있어서,
   정사각형으로 잘라도 띠가 그대로 남는다. maxres(1280x720) 와 mq(320x180) 만 띠가 없다. */
const thumbFor=id=>'https://i.ytimg.com/vi/'+id+'/maxresdefault.jpg';
const thumbAlt=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
/* 썸네일이 아예 없는 영상(삭제·비공개 등)은 저화질판도 깨진 이미지로 뜬다.
   그마저 실패하면 앱 아이콘으로 확실히 채운다 */
function thumbFallbackAttr(id){
  return `onerror="this.onerror=function(){this.onerror=null;this.src='icon-512.png';this.classList.add('fallback-icon');};this.src='${thumbAlt(id)}'"`;
}

async function fetchMeta(id){
  try{
    const r=await fetch('https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v='+id);
    if(!r.ok) throw 0;
    const j=await r.json();
    return {title:j.title,author:j.author_name};   // 썸네일은 oEmbed 것을 쓰지 않는다
  }catch(e){ return {title:null,author:null}; }
}
function addVideos(ids){
  let n=0;
  ids.forEach(id=>{
    if(crate.some(x=>x.id===id)) return;
    crate.push({id,title:'불러오는 중…',author:'YouTube',thumb:thumbFor(id)}); n++;
    /* maxres 가 없는 영상이면 16:9 저해상도(mq)로 낮춘다 — 4:3 은 절대 쓰지 않는다 */
    (function(vid){
      const probe=new Image();
      probe.onerror=()=>{
        const it=crate.find(x=>x.id===vid); if(!it) return;
        it.thumb=thumbAlt(vid); save(); renderAll();
        if(crate[current]&&crate[current].id===vid){ lblKey=null; setLabel(it); setBG(it); }
      };
      probe.src=thumbFor(vid);
    })(id);
    fetchMeta(id).then(m=>{
      const it=crate.find(x=>x.id===id); if(!it) return;
      if(m.title) it.title=m.title;
      if(m.author) it.author=m.author;
      save(); renderAll();
      clearTimeout(prefetchT); prefetchT=setTimeout(prefetchArt, 2500);
      if(crate[current]&&crate[current].id===id){ setLabel(it); setBG(it); }
    });
  });
  save(); renderAll(); updateButtons();
  return n;
}
function addPlaylist(listId){
  if(!ready){ toast('플레이어 준비 중… 잠시 후 다시 시도하세요'); return; }
  toast('재생목록을 읽는 중…');
  player.cuePlaylist({list:listId,listType:'playlist'});
  let tries=0;
  const t=setInterval(()=>{
    tries++;
    const ids=(player.getPlaylist&&player.getPlaylist())||[];
    if(ids.length){
      clearInterval(t);
      const n=addVideos(ids);
      toast(n?n+'장의 LP를 넣었어요':'이미 모두 들어 있어요');
      // 이름을 정해 두지 않은 목록이면 첫 곡의 아티스트로 자동 명명
      const c=activeCrate();
      if(/^재생목록/.test(c.name)) setTimeout(()=>{
        const a=cleanArtist(c.items[0]&&c.items[0].author);
        if(a&&a!=='YouTube'){ c.name=a; save(); renderAll(); }
      },1800);
    }
    else if(tries>26){ clearInterval(t); toast('재생목록을 불러오지 못했어요 (비공개일 수 있어요)'); }
  },300);
}
function handleAdd(){
  const raw=$('#url').value.trim();
  if(!raw){ toast('유튜브 링크를 붙여넣어 주세요'); return; }
  const p=parseInput(raw);
  $('#url').value='';
  closeBar();
  if(p.videos.length){
    const n=addVideos(p.videos);
    toast(n?n+'장의 LP를 넣었어요':'이미 크레이트에 있어요');
    return;
  }
  if(p.list){
    // 재생목록은 별도 목록으로 — 지금 목록에 곡이 있으면 새로 만든다
    if(crate.length){ newCrate('재생목록 '+(lib.crates.length+1)); }
    addPlaylist(p.list);
    return;
  }
  toast('유튜브 링크를 인식하지 못했어요');
}

    railFocus();

}

/* 세로 커버플로우 — 스크롤 위치에 따라 각 판을 눕히고 뒤로 밀어낸다.
   레이아웃 좌표(offsetTop)로 계산해야 transform 이 계산에 되먹임되지 않는다. */
let railRAF=null;
/* fromScroll 이 true 일 때만 곡 정보 자리에 미리보기를 띄운다.
   레이아웃·복귀 때도 띄우면, 앱을 다녀올 때 첫 곡 이름이 잠깐 나타났다 사라진다. */
/* 가운데를 기준으로 앞뒤 세 장까지 곱게 눕히고, 그보다 먼 판은 서서히 사라지게 한다.
   거리에 비례해 계속 눕히면 먼 판들이 얇은 조각으로 눌린 채 겹쳐 쌓여 지저분해진다.
   기울기는 세 장 거리에서 최대에 도달한 뒤 더 커지지 않는다. */
const RAIL_FADE=3.6;                 // 이 거리(장 단위)를 넘어가면 완전히 사라진다
const RAIL_TILT=3.0;                 // 이 거리에서 기울기가 최대가 된다
function railFocus(fromScroll){
  const h=el.rail.clientHeight;
  if(!h) return;
  const items=el.track.querySelectorAll('.lp');
  if(!items.length) return;
  const mid=railOff + h/2;
  // 판 사이 간격을 실제 배치에서 읽는다 (기기·화면 크기와 무관하게 일정한 모양)
  const stride = items.length>1
    ? Math.abs(items[1].offsetTop - items[0].offsetTop) || items[0].offsetHeight*0.62
    : items[0].offsetHeight*0.62;

  let best=null, bestD=1e9, bestI=-1;
  items.forEach((n,i)=>{
    const c=n.offsetTop + n.offsetHeight/2;
    const d=(c-mid)/stride;                       // 가운데에서 몇 장 떨어져 있나
    const a=Math.abs(d);
    const e=Math.sign(d)*Math.min(1, a/RAIL_TILT);// -1..1 로 부드럽게 묶는다
    const ae=Math.abs(e);
    const rx=-58*e;                               // 바깥쪽 모서리가 뒤로 눕는다
    const z=-ae*190;
    const sc=1-ae*0.15;
    const op=Math.max(0, 1-a/RAIL_FADE);          // 멀어지면 겹쳐 쌓이지 않고 사라진다
    n.style.transform=`perspective(1000px) translateZ(${z.toFixed(1)}px) rotateX(${rx.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
    n.style.zIndex=String(240-Math.round(ae*95));
    n.style.opacity=op.toFixed(3);
    n.style.pointerEvents = op<0.06 ? 'none' : '';  // 안 보이는 판은 눌리지 않게
    const ad=Math.abs(c-mid);
    if(ad<bestD){ bestD=ad; best=n; bestI=i; }
  });
  items.forEach(n=>n.classList.toggle('focus', n===best));
  if(fromScroll && bestI>=0 && crate[bestI] && bestI!==current) previewMeta(crate[bestI]);
}

/* 선반을 넘기는 동안엔 곡 정보 자리에 그 앨범을 미리 보여주고,
   잠시 뒤 재생 중인 곡으로 되돌린다 — 제목이 두 군데 뜨지 않도록 */

/* 미리보기는 "선반을 손으로 만지는 중"일 때만.
   렌더링·복귀·톤암 조작 등으로 생기는 스크롤에서는 뜨지 않아야 한다.
   관성 스크롤이 손을 뗀 뒤에도 이어지므로 마지막 접촉 시각으로 판정한다. */
let railTouch=0;
const markTouch=()=>{ railTouch=Date.now(); };
el.rail.addEventListener('pointerdown',markTouch,{capture:true,passive:true});
el.rail.addEventListener('pointermove',markTouch,{capture:true,passive:true});
el.rail.addEventListener('pointerup',markTouch,{capture:true,passive:true});
el.rail.addEventListener('touchstart',markTouch,{capture:true,passive:true});
el.rail.addEventListener('touchmove',markTouch,{capture:true,passive:true});


/* 재생 중인 판을 선반 가운데로.
   scrollIntoView 는 쓰지 않는다 — 스크롤 가능한 조상을 전부 스크롤해서
   iOS 에서는 문서 자체가 밀려 올라가고 상단 바가 화면 밖으로 나가 버린다.
   선반만 직접 스크롤한다. */
function railScrollTo(i, instant){
  const n=el.track.querySelectorAll('.lp')[i];
  if(!n) return;
  const target=Math.max(0, Math.min(railMax(), n.offsetTop + n.offsetHeight/2 - el.rail.clientHeight/2));
  stopGlide();
  if(instant){ railSet(target); return; }
  const from=railOff, d=target-from, t0=now();
  (function tween(){
    const k=Math.min(1,(now()-t0)/420);
    railSet(from + d*(1-Math.pow(1-k,3)));
    if(k<1) glideRAF=requestAnimationFrame(tween);
  })();
}
