   이벤트
   ============================================================ */
function removeAt(i){
  if(i<0||i>=crate.length) return;
  crate.splice(i,1);
  if(current===i){
    current=-1; el.disc.classList.add('hide'); setPlaying(false); setArm(null);
    if(ready&&player.stopVideo) player.stopVideo();
    el.fill.style.width='0%'; el.time.textContent='0:00 / 0:00'; lblKey=null; setBG(null);
    restoreMeta();
  } else if(current>i) current--;
  save(); renderAll(); updateButtons();
}
/* 다른 재생목록으로 곡 복사 (원본은 그대로) */
function copyItems(items, ci){
  const target=lib.crates[ci];
  if(!target) return 0;
  let n=0;
  items.forEach(it=>{
    if(target.items.some(x=>x.id===it.id)) return;
    target.items.push(Object.assign({},it));
    n++;
  });
  if(n) save();
  renderAll();
  return n;
}
function moveItem(from,to){
  if(from===to||from<0||to<0||from>=crate.length||to>=crate.length) return;
  const [it]=crate.splice(from,1);
  crate.splice(to,0,it);
  if(current===from) current=to;
  else if(from<current&&to>=current) current--;
  else if(from>current&&to<=current) current++;

  /* 격자와 선반을 다시 그리지 않고 DOM 노드만 옮긴다.
     통째로 다시 만들면 이미지가 새로 그려지면서 놓는 순간 깜빡인다. */
  [el.gwrap, el.track].forEach(c=>{          // 선반은 트랙 안에 들어 있다
    const kids=[...c.children];
    if(kids.length!==crate.length) return;
    const [n]=kids.splice(from,1);
    if(!n) return;
    kids.splice(to,0,n);
    kids.forEach((x,i)=>{ x.dataset.i=i; c.appendChild(x); });
  });
  el.gwrap.dataset.sig=gridHTML();
  el.track.dataset.sig=railHTML();
  [...el.gwrap.children].forEach((n,i)=>n.classList.toggle('on', i===current));
  [...el.track.children].forEach((n,i)=>n.classList.toggle('on', i===current));

  save(); renderCrates(); railFocus();
}

let suppressClick=false, suppressT=null;
function setSuppress(){
  suppressClick=true;
  clearTimeout(suppressT);
  suppressT=setTimeout(()=>suppressClick=false,350);  // 혹시 click 이 안 와도 걸려 있지 않게
}
function pickHandler(e){
  if(suppressClick){ suppressClick=false; clearTimeout(suppressT); return; }
  const del=e.target.closest('[data-del]');
  if(del){ removeAt(+del.dataset.del); return; }
  const c=e.target.closest('.gcell,.lp');
  if(!c) return;
  // 편집 중에는 탭해도 재생되지 않는다 — 정리하다 곡이 바뀌면 당황스럽다
  if(el.gwrap.classList.contains('editing')) return;
  playIndex(+c.dataset.i);
}
el.gwrap.addEventListener('click',pickHandler);
el.rail.addEventListener('click',pickHandler);

/* ============================================================
   선반 제스처 — 왼쪽으로 밀어 삭제, 길게 눌러 순서 바꾸기
   ============================================================ */
/* 선반에서는 밀어서 삭제만. 순서 바꾸기는 앨범 뷰에서 매끄럽게 지원한다 */
let g=null;
const SWIPE_KILL=88;

const now=()=>(window.performance&&performance.now)?performance.now():Date.now();

/* ---- 선반 스크롤 엔진 ----
   브라우저의 스크롤을 전혀 쓰지 않는다. 안쪽 트랙을 transform 으로 직접 옮긴다.
   scrollHeight 가 어떻게 계산되든 영향을 받지 않는다. */
let railOff=0, glideRAF=null;
function stopGlide(){ cancelAnimationFrame(glideRAF); glideRAF=null; }
function railMax(){
  return Math.max(0, el.track.offsetHeight - el.rail.clientHeight);
}
function railApply(){
  el.track.style.transform='translate3d(0,'+(-railOff).toFixed(1)+'px,0)';
}
function railSet(v, fromTouch){
  const m=railMax();
  railOff=Math.max(0, Math.min(m, v));
  railApply();
  railFocus(!!fromTouch);
  return railOff;
}
function railClamp(){ railSet(railOff); }
function glide(v){
  stopGlide();
  (function step(){
    v*=0.94;
    if(Math.abs(v)<0.35) return;
    const before=railOff;
    railSet(before+v, true);
    if(railOff===before) return;      // 끝에 닿으면 멈춘다
    glideRAF=requestAnimationFrame(step);
  })();
}

el.rail.addEventListener('pointerdown',e=>{
  stopGlide();
  const n=e.target.closest('.lp');
  if(e.target.closest('.rdel')) return;
  // 포인터 캡처는 제스처가 실제로 시작된 뒤에만. 미리 잡으면 탭의 click 이 씹힌다
  g={n, i:n?+n.dataset.i:-1, sx:e.clientX, sy:e.clientY, dx:0, dy:0, id:e.pointerId, mode:null,
     top0:railOff, ly:e.clientY, lt:now(), vy:0};
  g.sl=n?n.querySelector('.sleeve'):null;
  if(g.sl) g.sl.style.willChange='transform';
});
el.rail.addEventListener('pointermove',e=>{
  if(!g||e.pointerId!==g.id) return;
  g.dx=e.clientX-g.sx; g.dy=e.clientY-g.sy;

  if(g.mode===null){
    // 세로가 먼저 크면 스크롤, 가로가 먼저 크면 스와이프 삭제
    if(Math.abs(g.dy)>8 && Math.abs(g.dy)>=Math.abs(g.dx)){
      g.mode='scroll';
      if(g.sl) g.sl.style.willChange='';
      try{ el.rail.setPointerCapture(g.id); }catch(err){}
    } else if(Math.abs(g.dx)>14 && g.n){
      g.mode='swipe'; g.n.classList.add('gesture');
      try{ el.rail.setPointerCapture(g.id); }catch(err){}
    } else return;
  }

  if(g.mode==='scroll'){
    railSet(g.top0 - g.dy, true);
    const t=now(), dt=t-g.lt;
    if(dt>0){ g.vy=(e.clientY-g.ly)/dt*16; g.ly=e.clientY; g.lt=t; }   // 프레임당 픽셀
    railTouch=Date.now();
    return;
  }

  const dx=Math.min(0,g.dx);
  g.sl.style.transform='translateX('+dx+'px)';
  g.n.classList.toggle('willdel', dx<-SWIPE_KILL);
});
function endGesture(){
  if(!g) return;
  const n=g.n, mode=g.mode, i=g.i, sl=g.sl;
  if(sl) sl.style.willChange='';
  if(mode==='scroll'){
    if(Math.abs(g.vy)>0.6) glide(-g.vy);   // 관성
    setSuppress();
    g=null; flushRender(); return;
  }
  if(mode==='swipe'){
    const kill=n.classList.contains('willdel');
    n.classList.remove('gesture','willdel');
    if(sl) sl.style.transform='';
    if(kill) removeAt(i);
    setSuppress();
  }
  g=null;
  flushRender();
}
el.rail.addEventListener('pointerup',endGesture);
el.rail.addEventListener('pointercancel',endGesture);
el.rail.addEventListener('pointerleave',endGesture);

/* ============================================================
   앨범 뷰에서 순서 바꾸기 — 끄는 동안 주변 앨범이 실제로 비켜선다
   ============================================================ */
let gd=null;
const GRID_HOLD=260;

function gridSlots(){
  return [...el.gwrap.children].map(c=>({x:c.offsetLeft, y:c.offsetTop, w:c.offsetWidth, h:c.offsetHeight}));
}
function beginGridDrag(){
  gd.active=true;
  gd.to=gd.from;                       // 좌표·레이어는 pointerdown 때 이미 준비해 뒀다
  gd.scroll0=$('#gridView').scrollTop; // 드래그 중 스크롤이 생기면 그만큼 보정한다
  el.gwrap.classList.add('reordering');
  gd.c.classList.add('grabbed');
  $('#gridView').style.overscrollBehavior='contain';
  try{ el.gwrap.setPointerCapture(gd.id); }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
}
/* from 에서 to 로 옮겼을 때 각 앨범이 앉을 자리로 밀어 준다 */
function shuffleGrid(){
  const {from,to,slots,cells}=gd;
  cells.forEach((c,i)=>{
    if(i===from) return;
    let j=i;
    if(from<to && i>from && i<=to) j=i-1;
    else if(from>to && i>=to && i<from) j=i+1;
    c.style.transform = (j===i) ? '' :
      `translate(${(slots[j].x-slots[i].x).toFixed(1)}px, ${(slots[j].y-slots[i].y).toFixed(1)}px)`;
  });
}
function chipAt(x,y){
  const chips=[...document.querySelectorAll('.cratechip[data-c]')];
  for(const ch of chips){
    const r=ch.getBoundingClientRect();
    if(x>=r.left-6&&x<=r.right+6&&y>=r.top-8&&y<=r.bottom+8) return ch;
  }
  return null;
}
function gridIndexAt(cx,cy){
  const gv=$('#gridView'), r=gv.getBoundingClientRect();
  const x=cx-r.left, y=cy-r.top+gv.scrollTop;
  let best=0,bd=1e12,cur=1e12;
  gd.slots.forEach((s,i)=>{
    const d=Math.hypot(x-(s.x+s.w/2), y-(s.y+s.h/2));
    if(i===gd.to) cur=d;
    if(d<bd){ bd=d; best=i; }
  });
  // 히스테리시스 — 경계 근처에서 두 칸 사이를 오가며 떨리는 걸 막는다
  if(gd.to!=null && bd > cur*0.78) return gd.to;
  return best;
}
el.gwrap.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.gcell');
  if(!c||e.target.closest('.gdel')) return;
  gd={c, from:[...el.gwrap.children].indexOf(c), sx:e.clientX, sy:e.clientY,
      id:e.pointerId, active:false, moved:false, dx:0, dy:0};
  /* 편집 중에는 기다릴 필요 없이 바로 집힌다 — 아이폰 홈화면 정렬처럼 */
  const editing=el.gwrap.classList.contains('editing');
  /* 첫 드래그가 버벅이는 걸 막는다.
     길게 누르기 판정까지 260ms 가 남아 있으므로, 그 사이에 레이아웃 좌표를 미리 읽고
     각 앨범을 합성 레이어로 올려 둔다. 드래그가 시작될 땐 클래스만 바꾸면 된다. */
  gd.slots=gridSlots();
  gd.cells=[...el.gwrap.children];
  gd.cells.forEach(x=>{ x.style.willChange='transform'; });
  if(editing) beginGridDrag();
  /* 편집을 안 누른 상태에서도 앨범을 길게 누르면 편집 모드로 들어간다 —
     전부 흔들리고 편집 버튼도 눌린 상태로 바뀐다 */
  else gd.timer=setTimeout(()=>{ if(gd&&!gd.active){ setEditing(true); beginGridDrag(); } }, GRID_HOLD);
});
el.gwrap.addEventListener('pointermove',e=>{
  if(!gd||e.pointerId!==gd.id) return;
  gd.dx=e.clientX-gd.sx; gd.dy=e.clientY-gd.sy;
  if(!gd.active){
    if(Math.hypot(gd.dx,gd.dy)>12){                      // 스크롤에 양보
      clearTimeout(gd.timer);
      gd.cells.forEach(x=>{ x.style.willChange=''; });
      gd=null;
    }
    return;
  }
  e.preventDefault();
  if(Math.hypot(gd.dx,gd.dy)>6){ gd.moved=true; gd.c.classList.add('moving'); }
  // 드래그 중 스크롤이 일어났다면 그만큼 더해 카드가 손가락에 붙어 있게 한다
  const drift=$('#gridView').scrollTop - (gd.scroll0||0);
  gd.c.style.transform=`translate(${gd.dx}px, ${gd.dy+drift}px) scale(1.07)`;

  // 실제로 손가락이 움직인 뒤에만 순서를 바꾼다 — 살짝 떨리는 정도로는 자리가 안 바뀌게
  if(!gd.moved) return;

  // 상단 재생목록 칩 위로 끌어오면 순서 바꾸기 대신 그 목록으로 복사
  const ch=chipAt(e.clientX,e.clientY);
  const dropTo=(ch && +ch.dataset.c!==lib.active) ? +ch.dataset.c : null;
  if(dropTo!==gd.drop){
    gd.drop=dropTo;
    document.querySelectorAll('.cratechip').forEach(x=>x.classList.toggle('dropok', x===ch && dropTo!==null));
  }
  if(gd.drop!==null) return;
  const t=gridIndexAt(e.clientX,e.clientY);
  if(t!==gd.to){ gd.to=t; shuffleGrid(); }
  autoScrollGrid(e.clientY);
});
/* 화면 위아래 끝으로 끌고 가면 목록이 따라 스크롤된다 */
let autoRAF=null, autoV=0;
function autoScrollGrid(y){
  const gv=$('#gridView'), r=gv.getBoundingClientRect();
  const edge=90;
  autoV = y < r.top+edge ? -(edge-(y-r.top))/edge*14
        : y > r.bottom-edge ? ((y-(r.bottom-edge))/edge)*14 : 0;
  if(autoV && !autoRAF){
    (function step(){
      if(!gd||!gd.active||!autoV){ autoRAF=null; return; }
      const before=gv.scrollTop;
      gv.scrollTop=before+autoV;
      if(gv.scrollTop!==before){ gd.slots=gridSlots(); }
      autoRAF=requestAnimationFrame(step);
    })();
  }
}
function endGridDrag(){
  if(!gd) return;
  clearTimeout(gd.timer);
  const {active,from,to,c,cells,moved,drop}=gd;
  (cells||[]).forEach(x=>{ x.style.willChange=''; });
  if(active){
    el.gwrap.classList.remove('reordering');
    c.classList.remove('grabbed','moving');
    c.style.transform='';
    (cells||[]).forEach(x=>x.style.transform='');
    document.querySelectorAll('.cratechip').forEach(x=>x.classList.remove('dropok'));
    $('#gridView').style.overscrollBehavior='';
    // 길게 누르기만 하고 움직이지 않았으면 그냥 탭으로 본다 → 재생되게 둔다
    if(moved){
      setSuppress();
      if(drop!=null&&drop!==undefined){
        const n=copyItems([crate[from]], drop);
        toast(n? '"'+lib.crates[drop].name+'"(으)로 복사했어요' : '이미 그 목록에 있어요');
      } else if(to!=null&&to!==from) moveItem(from,to);
    }
  }
  gd=null; autoV=0;
  flushRender();          // 드래그 중 미뤄 둔 갱신을 이제 반영한다
}
el.gwrap.addEventListener('pointerup',endGridDrag);
el.gwrap.addEventListener('pointercancel',endGridDrag);

/* ============================================================
   앨범 뷰 — 두 손가락으로 꼬집어 칸 크기(개수)를 조절한다.
   손가락이 움직일 때마다(최대 초당 수백 번) --gcell-min 을 바로 반영하면
   grid-template-columns 가 그만큼 자주 다시 계산돼 버벅인다.
   대신 값은 매번 기록해 두되, 실제 반영은 requestAnimationFrame 으로 화면 주사율만큼만
   묶어서 — 계속 실시간으로 이어지면서도 불필요한 재계산은 걸러낸다. */
const GZ_MIN=92, GZ_MAX=230, GZ_KEY='vinyl_gcellmin';
let gcellMin=parseFloat(localStorage.getItem(GZ_KEY))||130;
el.gwrap.style.setProperty('--gcell-min', gcellMin+'px');
const pinchPts=new Map();
let pinchStart=null, pinchTarget=null, pinchRAF=null;
function pinchDist(){
  const p=[...pinchPts.values()];
  return p.length<2 ? 0 : Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
}
function applyPinch(){
  pinchRAF=null;
  if(pinchTarget==null) return;
  gcellMin=pinchTarget;
  el.gwrap.style.setProperty('--gcell-min', gcellMin.toFixed(1)+'px');
}
el.gwrap.addEventListener('pointerdown',e=>{
  pinchPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinchPts.size===2){
    pinchStart={dist:pinchDist(), base:gcellMin};
    // 두 손가락이 잡히면 한 손가락 드래그(순서 바꾸기)는 취소한다
    if(gd){
      clearTimeout(gd.timer);
      if(gd.c) gd.c.classList.remove('grabbed','moving');
      el.gwrap.classList.remove('reordering');
      gd=null;
    }
  }
});
el.gwrap.addEventListener('pointermove',e=>{
  if(!pinchPts.has(e.pointerId)) return;
  pinchPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinchPts.size===2 && pinchStart && pinchStart.dist>0){
    e.preventDefault();
    const scale=pinchDist()/pinchStart.dist;
    pinchTarget=Math.max(GZ_MIN, Math.min(GZ_MAX, pinchStart.base*scale));
    if(!pinchRAF) pinchRAF=requestAnimationFrame(applyPinch);
  }
});
function endPinchPointer(e){
  if(!pinchPts.has(e.pointerId)) return;
  pinchPts.delete(e.pointerId);
  if(pinchPts.size<2 && pinchStart){
    pinchStart=null; pinchTarget=null;
    if(pinchRAF){ cancelAnimationFrame(pinchRAF); pinchRAF=null; }
    try{ localStorage.setItem(GZ_KEY, Math.round(gcellMin)); }catch(err){}
  }
}
el.gwrap.addEventListener('pointerup',endPinchPointer);
el.gwrap.addEventListener('pointercancel',endPinchPointer);

/* ============================================================
   앱 안 입력창 — 시스템 prompt/confirm 을 쓰면 전체 화면이 풀린다
   ============================================================ */
const modal=$('#modal'), mTitle=$('#modalTitle'), mInput=$('#modalInput');
let mResolve=null;
function closeModal(v){
  modal.classList.remove('on');
  mInput.blur();
  const r=mResolve; mResolve=null;
  if(r) r(v);
}
function askText(title, value){
  return new Promise(res=>{
    mResolve=res;
    mTitle.textContent=title;
    mInput.classList.remove('hide');
    mInput.value=value||'';
    modal.classList.add('on');
    setTimeout(()=>{ mInput.focus(); mInput.select(); },80);
  });
}
function askConfirm(title){
  return new Promise(res=>{
    mResolve=res;
    mTitle.textContent=title;
    mInput.classList.add('hide');
    modal.classList.add('on');
  });
}
$('#modalOk').addEventListener('click',()=>
  closeModal(mInput.classList.contains('hide') ? true : mInput.value));
$('#modalCancel').addEventListener('click',()=>
  closeModal(mInput.classList.contains('hide') ? false : null));
modal.addEventListener('click',e=>{
  if(e.target===modal) closeModal(mInput.classList.contains('hide')?false:null);
});
mInput.addEventListener('keydown',e=>{
  if(e.key==='Enter') closeModal(mInput.value);
  if(e.key==='Escape') closeModal(null);
});

/* ---- 공유 링크: 곡 ID만 주소에 담는다 (제목은 열 때 다시 가져옴) ---- */
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(s))); }

$('#mShare').addEventListener('click',async()=>{
  closeMenu();
  if(!crate.length){ toast('빈 재생목록은 공유할 수 없어요'); return; }
  const payload=b64enc(JSON.stringify({n:activeCrate().name,i:crate.map(x=>x.id)}));
  const url=location.origin+location.pathname+'#c='+payload;
  try{
    await navigator.clipboard.writeText(url);
    toast('공유 링크를 복사했어요 ('+crate.length+'곡)');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('공유 링크를 복사했어요'); }
    catch(e2){ prompt('이 주소를 복사하세요', url); }
    ta.remove();
  }
});

function importFromHash(){
  const m=/^#c=(.+)$/.exec(location.hash||'');
  if(!m) return;
  try{
    const j=JSON.parse(b64dec(m[1]));
    if(!j.i||!j.i.length) throw 0;
    history.replaceState(null,'',location.pathname);
    newCrate(j.n||'공유된 목록');
    addVideos(j.i);
    toast('"'+(j.n||'공유된 목록')+'" '+j.i.length+'곡을 불러왔어요');
  }catch(e){ history.replaceState(null,'',location.pathname); }
}

/* ＋ 추가 — 클립보드에서 바로 읽어 넣는다.
   iOS 는 입력창에 포커스가 가서 키보드가 올라오면 전체 화면을 강제 종료하므로,
   붙여넣기만으로 끝나면 키보드를 띄울 일이 없다. */
function isFullscreen(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement||
            window.navigator.standalone===true);
}
function openBar(focus){
  $('#topbar').classList.add('on');

}

  if($('#topbar').classList.contains('on')){       // 열려 있으면 닫기
    closeBar();
    return;
  }
  let txt='';
  try{ txt=(await navigator.clipboard.readText())||''; }catch(e){ txt=''; }

      $('#url').value=txt;
      handleAdd();

  openBar(true);
  if(isFullscreen()) toast('유튜브에서 링크를 복사한 뒤 ＋ 추가를 다시 누르면 바로 들어갑니다');

/* ---- 화면 맨 왼쪽 가장자리를 오른쪽으로 슬라이드해도 선반이 열리게 (버튼 없이도) ---- */
let edgeSwipe=null;
document.addEventListener('pointerdown',e=>{
  if(!document.body.classList.contains('railoff')) return;
  if(e.clientX>24) return;   // 화면 맨 왼쪽 가장자리에서 시작했을 때만
  edgeSwipe={x:e.clientX,y:e.clientY,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!edgeSwipe||e.pointerId!==edgeSwipe.id) return;
  const dx=e.clientX-edgeSwipe.x, dy=e.clientY-edgeSwipe.y;
  if(Math.abs(dy)>40){ edgeSwipe=null; return; }   // 위아래로 어긋나면 스크롤 의도로 보고 포기
  if(dx>50){ setRail(false); edgeSwipe=null; }
});
document.addEventListener('pointerup',()=>{ edgeSwipe=null; });
document.addEventListener('pointercancel',()=>{ edgeSwipe=null; });

/* ---- 전체 화면 ----
   홈 화면에 추가해서 열면 이미 전체 화면이라 버튼을 숨긴다.
   사파리 탭에서 열었고 Fullscreen API 가 되면 버튼을 보여 준다. */
const app=document.getElementById('app');
const standalone = (window.navigator.standalone===true) ||
  (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const canFull = !!(app.requestFullscreen || app.webkitRequestFullscreen ||
                   document.documentElement.webkitRequestFullscreen);
const chipFull=$('#chipFull');
const FSKEY='vinyl_wantfull';
let wantFull=false;
try{ wantFull=localStorage.getItem(FSKEY)==='1'; }catch(e){}

function fsOn(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function enterFS(){
  const t=document.documentElement;
  const fn=t.requestFullscreen||t.webkitRequestFullscreen;
  if(fn) try{ const r=fn.call(t); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
}
function exitFS(){
  const fn=document.exitFullscreen||document.webkitExitFullscreen;
  if(fn) try{ fn.call(document); }catch(e){}
}

if(!standalone && canFull){
  chipFull.style.display='';
  chipFull.addEventListener('click',()=>{
    if(fsOn()){ wantFull=false; exitFS(); }
    else{ wantFull=true; enterFS(); }
    try{ localStorage.setItem(FSKEY, wantFull?'1':'0'); }catch(e){}
  });

  /* iOS 는 키보드가 뜨거나 시스템 창이 열리면 전체 화면을 강제로 끈다.
     사용자가 버튼으로 끈 게 아니라면, 다음 탭 때 조용히 다시 들어간다.
     (전체 화면 진입은 사용자 제스처 안에서만 허용되므로 자동 복귀는 불가능하다) */
  const rearm=()=>{
    if(!wantFull||fsOn()) return;
    // pointerdown 이 아니라 click 으로 잡는다.
    // 터치가 시작되는 순간 전체 화면으로 전환하면 그 스크롤 제스처가 취소돼 버린다.
    const once=()=>{
      document.removeEventListener('click',once,true);
      if(wantFull&&!fsOn()) enterFS();
    };
    document.addEventListener('click',once,true);
  };
  const syncFull=()=>{
    const on=fsOn();
    chipFull.setAttribute('aria-pressed',on);
    chipFull.innerHTML = on ? "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 4h2v5H6V7h3V4zm4 0h2v3h3v2h-5V4zM6 15h5v5H9v-3H6v-2zm7 0h5v2h-3v3h-2v-5z\"/></svg>" : "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z\"/></svg>";
    setTimeout(()=>{ layout(); railFocus(); },260);
    if(!on) rearm();
  };
  document.addEventListener('fullscreenchange',syncFull);
  document.addEventListener('webkitfullscreenchange',syncFull);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) rearm(); });
  if(wantFull) rearm();   // 지난번에 전체 화면으로 쓰고 있었다면 첫 탭에서 복귀
}

function setEditing(on){
  el.gwrap.classList.toggle('editing',on);
  el.rail.classList.toggle('editing',on);
  $('#chipEdit').setAttribute('aria-pressed',on);
}
$('#chipEdit').addEventListener('click',function(){
  const on=!el.gwrap.classList.contains('editing');
  setEditing(on);
  if(on && view!=='grid') setView('grid');   // 뷰를 억지로 바꾸지 않는다
});
/* 빈 곳을 누르면 편집 종료 */
document.addEventListener('click',e=>{
  if(!el.gwrap.classList.contains('editing')) return;
  if(e.target.closest('.gcell,.lp,.corner,.crates,.menu,#chooser,#switcher,.pills,.modal,.railtoggle,#topbar,#ytwrap')) return;
  setEditing(false);
});
$('#ytwrap').addEventListener('click',function(){ this.classList.toggle('big'); });

el.play.addEventListener('click',togglePlay);
el.next.addEventListener('click',next);
el.prev.addEventListener('click',prev);
/* 판을 좌우로 밀면 이전 / 다음 곡.
   탭은 재생·일시정지이므로, 옆으로 충분히 민 경우에만 곡을 넘긴다. */
let ds=null;
const DISC_SWIPE=70;
el.disc.addEventListener('pointerdown',e=>{
  if(current<0) return;
  ds={x:e.clientX, y:e.clientY, id:e.pointerId, moved:false};
});
el.disc.addEventListener('pointermove',e=>{
  if(!ds||e.pointerId!==ds.id) return;
  const dx=e.clientX-ds.x, dy=e.clientY-ds.y;
  if(!ds.moved && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){
    ds.moved=true;
    try{ el.disc.setPointerCapture(ds.id); }catch(err){}
  }
  if(ds.moved){
    e.preventDefault();
    const k=Math.max(-1,Math.min(1,dx/260));
    el.disc.style.transition='none';
    el.disc.style.transform='translateX('+(k*46).toFixed(1)+'px) scale('+(1-Math.abs(k)*0.045).toFixed(3)+')';
    el.disc.style.opacity=(1-Math.abs(k)*0.28).toFixed(3);
  }
});
function discEnd(){
  if(!ds) return;
  const moved=ds.moved, dx=ds.lastdx||0;
  el.disc.style.transition='';
  el.disc.style.transform='';
  el.disc.style.opacity='';
  if(moved){
    setSuppress();
    if(dx<=-DISC_SWIPE) next();
    else if(dx>=DISC_SWIPE) prev();
  }
  ds=null;
}
el.disc.addEventListener('pointerup',e=>{ if(ds&&e.pointerId===ds.id) ds.lastdx=e.clientX-ds.x; discEnd(); });
el.disc.addEventListener('pointercancel',discEnd);

/* 판 자체를 탭하면 재생/일시정지 */
el.disc.addEventListener('click',e=>{ if(suppressClick){ suppressClick=false; return; } togglePlay(); });

document.querySelectorAll('#switcher button').forEach(b=>
  b.addEventListener('click',()=>setView(b.dataset.v)));

/* 진행 바 스크럽 */
const ph=$('#progHit'); let scrub=false;
function seekAt(x){
  if(!ready||current<0||!player.getDuration) return;
  const p=Math.max(0,Math.min(1,x/window.innerWidth));
  el.fill.style.width=(p*100)+'%'; setArm(p, true);
  player.seekTo(p*(player.getDuration()||0),true);
}
ph.addEventListener('pointerdown',e=>{ scrub=true; ph.setPointerCapture(e.pointerId); seekAt(e.clientX); });
ph.addEventListener('pointermove',e=>{ if(scrub) seekAt(e.clientX); });
ph.addEventListener('pointerup',()=>scrub=false);
ph.addEventListener('pointercancel',()=>scrub=false);

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight') next();
  if(e.code==='ArrowLeft') prev();
});
/* ============================================================
   앱 전환 후 복귀 처리
   다른 앱에 다녀오면 pointerup 이 오지 않아 제스처가 끝나지 않은 채로 남는다.
   포인터 캡처가 걸린 요소는 사파리가 스크롤을 더 이상 처리해 주지 않으므로
   선반이 아예 안 움직이게 된다. 돌아올 때마다 전부 초기화한다.
   ============================================================ */
function resetInteractions(){
  if(g){
    try{ el.rail.releasePointerCapture(g.id); }catch(e){}
    if(g.sl){ g.sl.style.transform=''; g.sl.style.willChange=''; }
    g.n.classList.remove('gesture','willdel');
    g=null;
  }
  if(gd){
    try{ el.gwrap.releasePointerCapture(gd.id); }catch(e){}
    clearTimeout(gd.timer);
    endGridDrag();
  }
  el.rail.style.overflowY='';
  $('#gridView').style.overscrollBehavior='';
  document.querySelectorAll('.cratechip').forEach(x=>x.classList.remove('dropok'));
}

/* ============================================================
   마지막 재생 상태 저장 · 복구
   앱을 껐다 켜도 듣던 곡과 위치에서 이어진다.
   localStorage 에만 저장하며 유튜브 인증 정보는 저장하지 않는다.
   ============================================================ */
const PSKEY='vinyl_playstate';
let pendingResume=null, psT=0;

function savePlayState(){
  if(current<0 || !crate[current]) return;
  let t=0, d=0;
  try{
    if(ready&&player.getCurrentTime) t=player.getCurrentTime()||0;
    if(ready&&player.getDuration)    d=player.getDuration()||0;
  }catch(e){}
  try{
    localStorage.setItem(PSKEY, JSON.stringify({
      videoId : crate[current].id,
      crate   : lib.active,
      index   : current,
      seconds : Math.max(0,t),
      duration: d,
      playing : !!playing,
      savedAt : Date.now()
    }));
  }catch(e){}
}
function loadPlayState(){
  try{ return JSON.parse(localStorage.getItem(PSKEY)||'null'); }catch(e){ return null; }
}
function preparePlayState(){
  const s=loadPlayState();
  if(!s||!s.videoId) return;
  if(typeof s.crate==='number' && lib.crates[s.crate] && s.crate!==lib.active){
    lib.active=s.crate; crate=lib.crates[s.crate].items;
  }
  let i=crate.findIndex(x=>x.id===s.videoId);
  if(i<0 && typeof s.index==='number' && crate[s.index] && crate[s.index].id===s.videoId) i=s.index;
  if(i<0) return;                       // 지워진 곡이면 복구하지 않는다
  pendingResume={i, seconds:Math.max(0,(s.seconds||0)-1), duration:s.duration||0};
}
/* iOS 는 사용자가 누르기 전에는 소리를 낼 수 없다.
   자동 재생 대신 그 지점을 큐에 올려 두고, 재생을 누르면 거기서 이어지게 한다. */
function tryRestore(){
  if(!pendingResume||!ready) return;
  const {i,seconds,duration}=pendingResume;
  pendingResume=null;
  const it=crate[i];
  if(!it) return;
  current=i;
  el.disc.classList.remove('hide');
  el.empty.classList.add('gone');
  lblKey=null; setLabel(it); setBG(it);
  restoreMeta();
  if(duration>0){
    const p=Math.min(1,seconds/duration);
    setArm(p);
    el.fill.style.width=(p*100)+'%';
    el.time.textContent=fmt(seconds)+' / '+fmt(duration);
  } else setArm(0);
  try{ player.cueVideoById({videoId:it.id, startSeconds:seconds}); }catch(e){}
  updateMediaSession();
  renderAll(); updateButtons();
  setTimeout(()=>railScrollTo(i),160);
}

/* iOS 는 웹 페이지가 백그라운드로 가면 미디어를 정지시킨다 (네이티브 앱만 백그라운드 재생 가능).
   막을 수는 없으니, 돌아왔을 때 끊긴 지점에서 이어지도록 한다. */
let wasPlaying=false, resumeAt=0;
function rememberPlayback(){
  savePlayState();
  wasPlaying=playing;
  try{ resumeAt=(ready&&player.getCurrentTime)?player.getCurrentTime():0; }catch(e){ resumeAt=0; }
}
function tryResume(){
  if(!wasPlaying||!ready||!player.playVideo) return;
  try{
    if(resumeAt>1 && player.getCurrentTime && Math.abs(player.getCurrentTime()-resumeAt)>2)
      player.seekTo(resumeAt,true);
    player.playVideo();
  }catch(e){}
  wasPlaying=false;
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) rememberPlayback(); });
window.addEventListener('pagehide',rememberPlayback);
window.addEventListener('blur',rememberPlayback);

/* 잠금화면·제어센터에 곡 정보를 띄우고 거기서 조작할 수 있게 */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const it=crate[current];
  try{
    if(it){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:cleanTitle(it.title)||'재생 중',
        artist:cleanArtist(it.author)||'YouTube',
        album:activeCrate().name,
        artwork:[{src:it.thumb,sizes:'512x512',type:'image/jpeg'}]
      });
    }
    navigator.mediaSession.playbackState = playing?'playing':'paused';
    navigator.mediaSession.setActionHandler('play',()=>{ if(ready) player.playVideo(); });
    navigator.mediaSession.setActionHandler('pause',()=>{ if(ready) player.pauseVideo(); });
    navigator.mediaSession.setActionHandler('previoustrack',prev);
    navigator.mediaSession.setActionHandler('nexttrack',next);
    navigator.mediaSession.setActionHandler('stop',()=>{ if(ready) player.pauseVideo(); });
    if(navigator.mediaSession.setPositionState && ready && player.getDuration){
      const dd=player.getDuration()||0, tt=player.getCurrentTime()||0;
      if(dd>0) navigator.mediaSession.setPositionState({duration:dd, position:Math.min(tt,dd), playbackRate:1});
    }
  }catch(e){}
}

/* 재생 상태와 톤암 위치를 플레이어의 실제 값으로 다시 맞춘다 */
function resync(){
  resetInteractions();
  layout();
  railFocus();
  if(!ready||!player) return;
  try{
    if(player.getPlayerState){
      const st=player.getPlayerState();
      const isPlaying = (window.YT && YT.PlayerState) ? st===YT.PlayerState.PLAYING : st===1;
      if(isPlaying!==playing) setPlaying(isPlaying);
    }
    if(player.getDuration){
      const dur=player.getDuration()||0, t=player.getCurrentTime()||0;
      if(dur>0){
        const p=t/dur;
        setArm(p, true);
        el.fill.style.width=(p*100)+'%';
        el.time.textContent=fmt(t)+' / '+fmt(dur);
      }
    }
  }catch(e){}
  tryResume();     // iOS 가 백그라운드에서 끊어 놓은 재생을 이어 붙인다
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(resync,60); });
window.addEventListener('pageshow',()=>setTimeout(resync,60));
window.addEventListener('focus',()=>setTimeout(resync,60));
window.addEventListener('blur',resetInteractions);
window.addEventListener('pagehide',resetInteractions);

/* ============================================================
   진단 패널 — 주소 뒤에 ?debug=1 을 붙이거나 CRATE 글씨를 세 번 탭
   선반 스크롤이 왜 안 되는지 눈으로 확인하기 위한 것
   ============================================================ */
const dbg=$('#dbg');
let dbgOn=/[?&]debug=1/.test(location.search), pdCount=0, pmCount=0, lastHit='-', lastMode='-';
function dbgPaint(){
  if(!dbgOn) return;
  const r=el.rail;
  dbg.textContent=
    'rail  ch='+r.clientHeight+'  track='+el.track.offsetHeight+'  off='+Math.round(railOff)+'\n'+
    'scrollable='+(railMax()>2 ? 'YES ('+Math.round(railMax())+'px)' : 'NO !!')+'\n'+
    'pointerdown='+pdCount+'  pointermove='+pmCount+'  mode='+lastMode+'\n'+
    '눌린 곳: '+lastHit+'\n'+
    'items='+el.track.querySelectorAll('.lp').length+'  view='+view+'\n'+
    (function(){
      const c=el.gwrap.children[0], s=el.track.querySelector('.sleeve');
      const cr=c?c.getBoundingClientRect():null, sr=s?s.getBoundingClientRect():null;
      const sq=r=>r? (Math.round(r.width)+'x'+Math.round(r.height)+(Math.abs(r.width-r.height)<2?' 정사각':' ← 안 맞음!')) : '-';
      return '격자칸 '+sq(cr)+'\n선반칸 '+sq(sr)+'\n'+
        'edit='+el.gwrap.classList.contains('editing')+
        '  reorder='+el.gwrap.classList.contains('reordering')+
        '  drag='+(gd?(gd.active?('active from='+gd.from+' to='+gd.to+' moved='+gd.moved):'armed'):'-');
    })();
}
let dbgTimer=null;
function dbgShow(on){
  dbgOn=on;
  dbg.style.display=on?'block':'none';
  clearInterval(dbgTimer); dbgTimer=null;
  if(on){ dbgPaint(); dbgTimer=setInterval(dbgPaint,300); toast('진단 표시 켜짐'); }
  else toast('진단 표시 꺼짐');
}

/* LP 색 — 블랙 / 화이트 / 클리어 / 앨범색 / 고정 프리셋 6가지 */
const VKEY='vinyl_color';
const VNAMES={black:'블랙', white:'화이트', clear:'투명', auto:'앨범색',
  red:'빨강', orange:'주황', yellow:'노랑', dgreen:'진초록', dblue:'진파랑', dpurple:'진보라'};
const PRESET_HEX={red:'#e5352a', orange:'#f0801e', yellow:'#f2c40c',
  dgreen:'#1a5f38', dblue:'#1e3f75', dpurple:'#5a2a86'};
let vinylColor='clear';        // 기본은 투명 바이닐
function setVinyl(c,save){
  vinylColor=VNAMES[c]?c:'clear';
  document.body.classList.remove('vinyl-white','vinyl-clear','vinyl-auto');
  // 앨범색·프리셋 색은 인라인 변수로 칠하므로, 다른 색으로 바꿀 땐 지워 준다
  ['--v1','--v2','--v3','--v4','--v5','--dw1','--dw2','--gr-hi','--gr-lo',
   '--bd-hi','--bd-lo','--v-edge','--v-shade','--sheen-op']
    .forEach(k=>document.documentElement.style.removeProperty(k));
  if(vinylColor==='white'||vinylColor==='clear'||vinylColor==='auto')
    document.body.classList.add('vinyl-'+vinylColor);
  if(vinylColor==='auto'){
    const cur=crate[current]||crate[0];
    if(cur&&cur.thumb) dominantColor(cur.thumb).then(applyAccent);
    else tintVinyl(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
  }
  if(PRESET_HEX[vinylColor]) tintVinyl(PRESET_HEX[vinylColor]);
  document.querySelectorAll('.swatch').forEach(s=>
    s.setAttribute('aria-pressed', s.dataset.v===vinylColor));
  if(save!==false){ try{ localStorage.setItem(VKEY,vinylColor); }catch(e){} }
}
document.querySelector('.vrow').addEventListener('click',e=>{
  const s=e.target.closest('.swatch');
  if(s) setVinyl(s.dataset.v);
});
try{ setVinyl(localStorage.getItem(VKEY)||'clear', false); }catch(e){ setVinyl('clear',false); }

/* 프리미엄이 아니면 곡 앞에 광고가 붙는다.
   유튜브 화면을 숨겨 두면 건너뛰기 버튼을 누를 수 없으므로,
   재생 길이가 광고처럼 짧으면 그동안만 화면을 잠깐 보여 준다. */
let adT=null;
function adWatch(){
  clearTimeout(adT);
  if(!document.body.classList.contains('ythide')) return;
  let n=0;
  (function check(){
    if(!ready||!player.getDuration) return;
    const d=player.getDuration()||0;
    const looksAd = d>0 && d<45;                 // 광고는 대개 30초 안팎
    document.body.classList.toggle('adshow', looksAd);
    if(++n<8) adT=setTimeout(check,1200);        // 약 10초간만 지켜본다
    else document.body.classList.remove('adshow');
  })();
}

/* ---- 유튜브 로그인 ----
   "홈 화면에 추가"는 사파리와 쿠키 저장소가 분리돼 있어, 사파리에서 프리미엄으로
   로그인해 놔도 이 앱에서는 로그인 안 한 것으로 취급된다.
   구글 로그인 페이지는 iframe에 못 넣게 막혀 있어(클릭재킹 방지), 앱의 최상위 화면을
   잠깐 유튜브로 바꿔서 이 컨테이너 안에서 직접 로그인시키는 방법뿐이다.
   로그인 후에는 이 페이지의 JS가 전부 사라지므로 자동으로 돌아올 방법이 없다 —
   앱 스위처에서 완전히 종료했다가 홈 화면 아이콘으로 다시 열면(같은 저장소를 그대로
   쓰므로) 로그인이 반영된 채로 앱이 새로 뜬다. */
/* standalone 감지에 기대지 않는다 — 기기·iOS 버전에 따라 오판할 여지가 있고,
   그래서 버튼이 계속 안 보인다는 문제가 반복됐다. 사파리 탭에서 눌러도
   해될 게 없으니(그냥 이동했다 뒤로가기) 항상 보여준다. */
/* m.youtube.com으로 바로 보내면 아이폰이 유니버설 링크로 가로채서 유튜브 '앱'을
   열어버린다 — 그러면 로그인은 앱 안에서 끝나고, 이 웹앱(사파리/홈화면) 쪽 쿠키
   저장소는 여전히 비어 있어 프리미엄이 하나도 반영이 안 된다.
   accounts.google.com은 유튜브 앱이 가로채는 도메인이 아니라서 그 문제를 피한다.
   로그인이 끝나면 구글이 알아서 continue 로 지정한 유튜브로 넘겨준다. */
const mLogin=$('#mLogin');
mLogin.style.display='';
mLogin.addEventListener('click',()=>{
  closeMenu();
  const ok=confirm(
    '구글 로그인 화면으로 이동합니다.\n\n'+
    '로그인을 마친 뒤에는 이 화면으로 자동으로 돌아오지 않습니다.\n'+
    '홈 화면 아이콘으로 열었다면 — 화면 아래에서 위로 쓸어올려 VINYL을 완전히 종료한 다음, '+
    '홈 화면 아이콘으로 다시 열어야 로그인이 반영됩니다.\n'+
    '사파리 탭이라면 — 로그인 후 뒤로가기로 돌아오면 됩니다.\n\n'+
    '다시 들어오면 유튜브 화면이 보이게 켜 둘게요 — 그 화면을 한 번 톡 눌러 주세요. '+
    '유튜브가 로그인 상태를 확인하는 데 필요한 동작입니다.\n\n계속할까요?'
  );
  if(!ok) return;
  setYTHide(false);   // 돌아왔을 때 유튜브 화면이 이미 보이는 채로, 톡 눌러 크게(.big) 만들 수 있게
  // m.youtube.com(모바일용) 대신 www — 유튜브 앱의 유니버설 링크가 모바일 서브도메인만
  // 물고 있고 데스크톱용 도메인은 안 건드릴 가능성을 시험해본다
  location.href='https://accounts.google.com/ServiceLogin?continue='+encodeURIComponent('https://www.youtube.com/');
});
function describe(n){
  if(!n) return 'null';
  let s=n.tagName.toLowerCase();
  if(n.id) s+='#'+n.id;
  if(n.className && typeof n.className==='string' && n.className.trim())
    s+='.'+n.className.trim().split(/\s+/).slice(0,2).join('.');
  return s;
}
document.addEventListener('pointerdown',e=>{
  if(!dbgOn) return;
  pdCount++;
  const stack=(document.elementsFromPoint? document.elementsFromPoint(e.clientX,e.clientY):[document.elementFromPoint(e.clientX,e.clientY)]);
  lastHit=stack.slice(0,5).map(describe).join('\n           ← ');
  dbgPaint();
},true);
document.addEventListener('pointermove',e=>{ if(dbgOn){ pmCount++; lastMode=g?(g.mode||'null'):'-'; } },true);
let capTaps=0,capT=null;
$('#railCap').style.pointerEvents='auto';
$('#railCap').addEventListener('click',()=>{
  capTaps++; clearTimeout(capT); capT=setTimeout(()=>capTaps=0,600);
  if(capTaps>=3){ capTaps=0; dbgShow(!dbgOn); }
});
if(dbgOn) dbgShow(true);

/* #app 은 position:fixed 라 문서가 실제로 스크롤돼도 화면엔 전혀 안 움직인다.
   그 성질을 거꾸로 이용해서, 사파리 탭(홈 화면 추가 아님)에서는 1px만 살짝 스크롤시켜
   주소창을 접어 버린다 — 화면은 안 흔들리면서 거의 전체 화면처럼 보이고,
   "홈 화면에 추가"와 달리 사파리 자체 탭이라 쿠키(유튜브 프리미엄 로그인)는 그대로 유지된다.
   그래서 아래 스크롤 방지 로직은 완전히 0으로 되돌리지 않고 1px 정도는 허용한다. */
window.addEventListener('scroll',()=>{
  if(window.scrollX || window.scrollY>2 || window.scrollY<0) window.scrollTo(0, window.scrollY>0?1:0);
},{passive:true});
if(!standalone){
  const hideAddressBar=()=>{
    if(document.documentElement.scrollHeight>innerHeight && window.scrollY<1) window.scrollTo(0,1);
  };
  // 첫 시도가 이미지·레이아웃이 덜 자리잡은 상태라 사파리가 무시하는 경우가 있어
  // 로드 직후 몇 차례 더 시도한다
  [50,200,400,700,1100,1600,2200].forEach(ms=>setTimeout(hideAddressBar,ms));
  window.addEventListener('load',()=>setTimeout(hideAddressBar,300));
  window.addEventListener('pageshow',()=>setTimeout(hideAddressBar,300));
  // 터치가 시작되는 순간 바로(딜레이 없이) 시도 — 실제 스크롤 제스처와 더 가깝게 묶인다
  document.addEventListener('touchstart',hideAddressBar,{passive:true});
  document.addEventListener('touchmove',hideAddressBar,{passive:true});
  document.addEventListener('touchend',()=>setTimeout(hideAddressBar,60),{passive:true});
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(hideAddressBar,150); });
}

/* 폭/높이 오차 허용치를 아무리 조정해도, 사파리가 주소창·탭바를 접었다 펴는 폭이
   기기·상황마다 달라서 숫자로는 확실히 못 걸러낸다.
   대신 이 리사이즈들은 전부 "손가락이 화면에 닿아 스크롤하는 동안" 일어난다는 공통점이 있다.
   진짜 회전·창 크기 변경은 손을 뗀 뒤(또는 손이 안 닿은 채로) 일어나므로,
   터치 중이거나 뗀 직후 잠깐(사파리 크롬 애니메이션이 끝날 시간)은 재배치를 미룬다. */
let touchLive=false, touchLiveT=null;
const markTouchLive=()=>{ touchLive=true; clearTimeout(touchLiveT); };
const clearTouchLive=()=>{ clearTimeout(touchLiveT); touchLiveT=setTimeout(()=>{ touchLive=false; },400); };
document.addEventListener('touchstart',markTouchLive,{passive:true});
document.addEventListener('touchmove',markTouchLive,{passive:true});
document.addEventListener('touchend',clearTouchLive,{passive:true});
document.addEventListener('touchcancel',clearTouchLive,{passive:true});

let lastResizeW=innerWidth;
window.addEventListener('resize',()=>{
  if(touchLive) return;   // 손가락이 닿아 있는 동안의 resize는 대부분 사파리 크롬 접힘/펼침이다
  const w=innerWidth;
  if(Math.abs(w-lastResizeW)<10) return;
  lastResizeW=w;
  layout(); railFocus();
});
window.addEventListener('orientationchange',()=>setTimeout(layout,320));

/* ============================================================
   부팅
   ============================================================ */
el.spin.style.setProperty('--rev','1.8s');
renderCrates(); renderRail(); renderGrid(); updateButtons(); setView('player'); syncModes();
layout(); setArm(null);
setTimeout(layout,140);
restoreMeta();
/* 유튜브 iframe API가 준비되기 전(수 초 걸릴 수 있다)엔 disc가 기본 hide 상태라
   판이 아예 안 보이고 톤암만 허공에 떠 있는 것처럼 보였다 — 곡이 있으면 플레이어가
   준비되길 기다리지 않고 바로 판(그루브)과 라벨을 먼저 보여준다 */
if(crate.length){
  el.empty.classList.add('gone'); setBG(crate[0]);
  el.disc.classList.remove('hide'); setLabel(crate[0]);
}
preparePlayState();          // 저장된 마지막 곡을 찾아 둔다
if(ready) tryRestore();

/* 좁은 화면에서는 선반을 기본으로 접는다 (직접 설정한 적이 없을 때만) */
try{
  if(localStorage.getItem(RAILKEY)===null && window.innerWidth<=820) setRail(true,false);
}catch(e){}

/* 블러 합성이 끝난 다음 프레임에 한 번에 보여준다 */
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.getElementById('app').classList.add('ready');
  layout(); railFocus();
}));
setTimeout(importFromHash,400);   // 공유 링크로 열렸으면 그 목록을 받아온다

const isFile = location.protocol==='file:';
if(isFile){
  const w=document.createElement('div');
  w.style.cssText='position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:80;max-width:640px;'+
    'padding:13px 20px;border-radius:14px;font-size:13px;line-height:1.6;text-align:center;'+
    'background:rgba(201,69,47,.94);color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.5);cursor:pointer;';
  w.innerHTML='<b>로컬 파일(file://)이라 유튜브가 재생을 차단합니다 — 오류 153</b><br>'+
    '터미널에서 <code>cd ~/Desktop &amp;&amp; python3 -m http.server 8000</code> 실행 후<br>'+
    '<code>http://localhost:8000/lp-turntable.html</code> 로 열어 주세요. (탭하면 닫힘)';
  w.onclick=()=>w.remove();
  document.getElementById('app').appendChild(w);
}
</script>
</body>
</html>
